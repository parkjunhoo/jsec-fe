<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀</title>
  <!-- CDN으로 Supabase JS SDK 로드 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 모바일 웹앱 설정 -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: rgba(15, 23, 42, 0.6);
      --border-color: rgba(255, 255, 255, 0.1);
      --error-color: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(30, 58, 138, 0.25) 0px, transparent 50%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: var(--text-main);
    }

    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 380px;
      padding: 40px 28px 36px 28px;
      border-radius: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .brand-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .brand-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background-color: var(--primary);
      border-radius: 50%;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 13px;
      color: var(--text-sub);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
      margin-left: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-group input {
      width: 100%;
      height: 52px;
      padding: 0 16px;
      font-size: 15px;
      color: #ffffff;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      outline: none;
      transition: all 0.2s ease;
      user-select: text;
    }

    .form-group input::placeholder {
      color: #475569;
    }

    .form-group input:focus {
      border-color: var(--primary);
      background: rgba(15, 23, 42, 0.8);
      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
    }

    .btn-submit {
      width: 100%;
      height: 54px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    .error-box {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--error-color);
      font-size: 13px;
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      margin-top: 16px;
      display: none;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .auth-loading {
      display: none;
      width: min(380px, 100%);
      min-height: 260px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 36px 28px;
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 28px;
      background: rgba(30, 41, 59, 0.58);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.28);
      color: var(--text-main);
      text-align: center;
    }
    .auth-loading-mark {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 18px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 0.08em;
      animation: auth-pulse 1.6s ease-in-out infinite;
    }
    .auth-loading-logo {
      display: block;
      width: 62px;
      height: 62px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(2, 132, 199, .2));
      animation: auth-logo-float 1.35s ease-in-out infinite;
    }
    .auth-loading-spinner {
      display: none;
    }
    .auth-loading strong { font-size: 16px; }
    .auth-loading span:last-child { color: var(--text-sub); font-size: 13px; }
    .auth-loading-progress { width: min(260px, 100%); }
    .auth-loading-progress-track { height: 8px; overflow: hidden; border-radius: 99px; background: rgba(148, 163, 184, .22); }
    .auth-loading-progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #38bdf8, #0284c7); transition: width 180ms ease-out; }
    .auth-loading-progress-value { display: block; margin-top: 8px; color: var(--text-sub); font-size: 12px; font-variant-numeric: tabular-nums; }
    body.auth-checking .app-card { display: none; }
    body.auth-checking .auth-loading { display: flex; }
    body:not(.auth-checking) .app-card { animation: fadeInUp .35s ease both; }
    @keyframes auth-logo-float { 50% { transform: translateY(-5px) rotate(4deg); } }
    @keyframes auth-pulse { 50% { transform: scale(1.04); box-shadow: 0 0 0 8px rgba(56, 189, 248, 0.05); } }
    @media (prefers-reduced-motion: reduce) {
      .auth-loading-mark, .auth-loading-logo, .auth-loading-progress-fill { animation: none; transition: none; }
    }
    html[data-theme="light"] body { background-color: #f4f7fb; background-image: radial-gradient(at 0% 0%, rgba(56, 189, 248, .12) 0, transparent 50%), radial-gradient(at 100% 100%, rgba(30, 58, 138, .1) 0, transparent 50%); color: #172033; }
    html[data-theme="light"] .auth-loading { border-color: rgba(2, 132, 199, .16); background: rgba(255, 255, 255, .86); box-shadow: 0 20px 40px rgba(39, 67, 99, .14); color: #172033; }
    html[data-theme="light"] .auth-loading-mark { border-color: rgba(2, 132, 199, .22); background: rgba(56, 189, 248, .1); color: #0284c7; }
    html[data-theme="light"] .auth-loading-progress-track { background: rgba(100, 116, 139, .16); }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body class="auth-checking">

  <div class="auth-loading" id="authLoading" role="status" aria-live="polite">
    <img class="auth-loading-logo" src="/logo.png" alt="">
    <strong>시스템 로딩중</strong>
    <div class="auth-loading-progress" aria-label="시스템 로딩 진행률">
      <div class="auth-loading-progress-track"><span class="auth-loading-progress-fill" id="authLoadingProgressFill"></span></div>
      <span class="auth-loading-progress-value" id="authLoadingProgressValue">0%</span>
    </div>
    <span id="authLoadingMessage">로그인 상태를 확인하고 있습니다.</span>
  </div>

  <div class="app-card">
    <div class="brand-header">
      <div class="brand-badge">JISAN SECURITY</div>
      <h1>보안관리 시스템</h1>
      <p>지산리조트 보안팀 전용 서비스</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">아이디</label>
        <div class="input-wrapper">
          <input type="text" id="username" placeholder="아이디 입력" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label for="password">비밀번호</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="비밀번호 입력" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">
        <span>로그인</span>
      </button>

      <div id="errorMessage" class="error-box"></div>
    </form>
  </div>

  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
