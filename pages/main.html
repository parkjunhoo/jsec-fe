<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 메인</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
    }

    /* 본문 컨텐츠 영역 */
    .container {
      padding: 24px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .welcome-banner {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 24px;
    }

    .welcome-banner h2 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #fff;
    }

    .welcome-banner p {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* 메뉴 그리드 */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .menu-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s, background 0.2s;
    }

    .menu-card:active {
      transform: scale(0.96);
      background: rgba(51, 65, 85, 0.8);
    }

    .menu-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <!-- 공통 상단바 & 햄버거 메뉴 바인딩 위치 -->
  <div id="navbar"></div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="container">
    <div class="welcome-banner">
      <h2>지산리조트 보안관리 시스템</h2>
      <p>필요한 업무 메뉴를 선택해 주세요.</p>
    </div>

    <div class="menu-grid">

      <!-- 회원 조회 메뉴 -->
      <a href="/pages/users.html" class="menu-card">
        <div class="menu-icon">📋</div>
        <div>
          <div class="menu-title">회원 명부</div>
          <div class="menu-desc">회원 정보 및 권한 관리</div>
        </div>
      </a>


      <!-- 차량 조회 메뉴 -->
      <a href="/pages/vehicle.html" class="menu-card">
        <div class="menu-icon">🚗</div>
        <div>
          <div class="menu-title">차량 조회</div>
          <div class="menu-desc">등록 차량 검색 및 확인</div>
        </div>
      </a>

            <!-- 캘린더 메뉴 -->
      <a href="/pages/calendar.html" class="menu-card">
        <div class="menu-icon">📅</div>
        <div>
          <div class="menu-title">휴무 일정 조회</div>
          <div class="menu-desc">휴무 일정 검색 및 확인</div>
        </div>
      </a>

      
    </div>

    <button id="broadcastPushBtn" type="button" style="display: none; margin-top: 16px; width: 100%; padding: 12px; border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 12px; background: rgba(56, 189, 248, 0.12); color: #38bdf8; font-weight: 700; cursor: pointer;">
      전체 푸시 알림 보내기
    </button>
  </main>

  <!-- JS 스크립트 연결 순서 -->
  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script>window.Swal = window.Sweetalert2;</script>
  <script src="/js/supabase.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    // 메인 페이지 전용 추가 세션 체크 (필요시)
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = '/index.html';
        return;
      }

      const { data: profile, error } = await supabaseClient
        .from('users')
        .select('role')
        .eq('id', session.user.id)
        .maybeSingle();
      if (error) {
        console.error('사용자 권한 조회 오류:', error);
        return;
      }
      if (profile && profile.role === 'admin') {
        document.getElementById('broadcastPushBtn').style.display = 'block';
      }

      document.getElementById('broadcastPushBtn').addEventListener('click', async () => {
        const result = await Swal.fire({
          title: '전체 푸시 알림',
          input: 'textarea',
          inputLabel: '알림 내용',
          inputPlaceholder: '팀원 전체에게 보낼 내용을 입력하세요.',
          inputAttributes: { maxlength: 500 },
          showCancelButton: true,
          confirmButtonText: '보내기',
          cancelButtonText: '취소',
          inputValidator: value => value && value.trim() ? undefined : '알림 내용을 입력해 주세요.'
        });
        if (!result.isConfirmed) return;

        try {
          const response = await fetch('https://jsec-serverless.adobephotoshop.workers.dev/api/push/broadcast', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${session.access_token}`
            },
            body: JSON.stringify({ title: '보안팀 공지', body: result.value.trim() })
          });
          const responseBody = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(responseBody.error || `HTTP ${response.status}`);

          await Swal.fire({
            icon: 'success',
            text: `전체 알림 발송을 요청했습니다. 성공 ${responseBody.sent}건, 실패 ${responseBody.failed}건`
          });
        } catch (sendError) {
          await Swal.fire({ icon: 'error', text: `알림 발송 실패: ${sendError.message}` });
        }
      });
    });
  </script>
</body>
</html>
