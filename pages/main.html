<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 메인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding: 10px 4px;
    }

    .user-info h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .user-info p {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .menu-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: var(--text-main);
      transition: transform 0.2s, background 0.2s;
    }

    .menu-card:active {
      transform: scale(0.96);
      background: rgba(51, 65, 85, 0.8);
    }

    .menu-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .menu-title {
      font-size: 16px;
      font-weight: 700;
    }

    .menu-desc {
      font-size: 12px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="user-info">
      <h2 id="userName">보안팀 대원님</h2>
      <p id="userRole">Jisan Security Team</p>
    </div>
    <button class="btn-logout" id="logoutBtn">로그아웃</button>
  </div>

  <div class="menu-grid">
    <!-- 차량 조회 메뉴 -->
    <a href="/pages/vehicle.html" class="menu-card">
      <div class="menu-icon">🚗</div>
      <div>
        <div class="menu-title">차량 조회</div>
        <div class="menu-desc">등록 차량 검색 및 확인</div>
      </div>
    </a>

    <!-- 직원 명부 / 근태 관리 메뉴 -->
    <a href="/pages/users.html" class="menu-card">
      <div class="menu-icon">📋</div>
      <div>
        <div class="menu-title">직원 명부</div>
        <div class="menu-desc">대원 정보 및 연차 관리</div>
      </div>
    </a>
  </div>

  <script src="/js/supabase.js"></script>
  <script>
    // 세션 체크 및 로그아웃 기능
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = '/index.html';
        return;
      }

      // 로그아웃 버튼 이벤트
      document.getElementById('logoutBtn').addEventListener('click', async () => {
        await supabase.auth.signOut();
        window.location.href = '/index.html';
      });
    });
  </script>
</body>
</html>
