<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 회원 조회 및 관리</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    .container {
      padding: 20px 16px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .user-count-badge {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 600;
    }

    .user-count-badge span {
      color: var(--primary);
      font-weight: 800;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .search-input {
      flex: 1;
      min-height: 45px;
      height: 48px;
      padding: 0 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }
    
    @media (max-width: 768px) {
      .top-actions {
        flex-direction: column;
        align-items: stretch;
      }
      
      .btn-add-user {
        min-height: 45px;
        width: 100%;
      }
    }

    .btn-add-user {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
      display: none;
    }

    /* --- 세련된 필터 박스 디자인 --- */
    .filter-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .sort-select:focus {
      border-color: var(--primary);
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      position: relative;
      cursor: pointer;
    }

    .filter-chip input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .chip-label {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .filter-chip input:checked + .chip-label {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.15);
    }

    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-view-controls {
      display: flex;
      justify-content: flex-end;
      gap: 4px;
      margin: 0 0 10px;
      padding: 4px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      background: var(--card-bg);
    }
    .user-view-button {
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .user-view-button[aria-pressed="true"] {
      border-color: var(--primary);
      background: var(--app-surface-raised, #24332b);
      color: var(--text-main);
    }

    .user-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-name-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      font-size: 17px;
      font-weight: 700;
    }

    .role-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .role-badge.admin {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .role-badge.user {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .btn-card-edit {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .user-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
      background: rgba(15, 23, 42, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .user-details div span {
      color: var(--text-main);
      font-weight: 500;
    }

    .user-list[data-view="table"] {
      display: block;
      overflow-x: auto;
      border: 1px solid var(--app-border, var(--border-color));
      border-radius: 12px;
      background: var(--app-surface, #1b2621);
    }
    .user-table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
      text-align: left;
    }
    .user-table th, .user-table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--app-border, var(--border-color));
      color: var(--text-main);
      font-size: 13px;
      vertical-align: middle;
    }
    .user-table th {
      background: var(--app-surface-raised, #24332b);
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }
    .user-table-name { font-weight: 750; white-space: nowrap; }
    .user-table-title { color: var(--primary) !important; font-weight: 750; white-space: nowrap; }
    .user-table tr:last-child td { border-bottom: 0; }
    .user-list[data-view="table"] .empty-state { padding: 32px 16px; }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 14px;
    }

    /* --- 모달 팝업 스타일 --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 300;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 24px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .btn-close-modal {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 20px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .modal-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-submit-user {
      flex: 1;
      height: 48px;
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-delete-user {
      height: 48px;
      padding: 0 16px;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>

  <!-- 공통 상단바 & 햄버거 메뉴 -->
  <div id="navbar"></div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="container">
    <div class="header-area">
      <div class="user-count-badge">
        총 회원 <span id="totalUserCount">0</span>명
      </div>
    </div>

    <!-- 검색창 및 회원 등록 버튼 -->
    <div class="top-actions">
      <input type="text" id="searchInput" class="search-input" placeholder="회원 이름 또는 근무지 검색...">
      <button class="btn-add-user" id="addUserBtn">+ 회원 등록</button>
    </div>

    <!-- 필터 및 정렬 박스 (전체 선택 버튼 추가) -->
    <div class="filter-box">
      <div class="filter-row">
        <span class="filter-title">정렬 기준</span>
        <select id="sortSelect" class="sort-select">
          <option value="name_asc">이름순 (가나다)</option>
          <option value="hire_desc">입사일 최신순</option>
          <option value="hire_asc">입사일 오래된순</option>
        </select>
      </div>

      <div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <span class="filter-title">근무지 및 근무시간</span>
          <button type="button" id="selectAllBtn" style="background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 4px;">전체 해제</button>
        </div>
        <div class="filter-groups">
          <div class="filter-group">
            <span class="filter-group-label">근무시간</span>
            <div class="filter-chips">
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="주간" checked>
                <span class="chip-label">주간</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="야간" checked>
                <span class="chip-label">야간</span>
              </label>
            </div>
          </div>
          <div class="filter-group">
            <span class="filter-group-label">근무지</span>
            <div class="filter-chips">
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="스키장" checked>
                <span class="chip-label">스키장</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="골프장" checked>
                <span class="chip-label">골프장</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="현관" checked>
                <span class="chip-label">현관</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="other" checked>
                <span class="chip-label">기타</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="user-view-controls" role="group" aria-label="회원 표시 방식">
      <button class="user-view-button" type="button" data-user-view="cards" aria-pressed="false">카드 보기</button>
      <button class="user-view-button" type="button" data-user-view="table" aria-pressed="true">표 보기</button>
    </div>

    <div class="user-list" id="userList">
      <div class="empty-state">회원 정보를 불러오는 중...</div>
    </div>
  </main>

  <!-- 회원 등록 / 수정 모달 팝업 -->
  <div class="modal-overlay" id="userModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">신규 회원 등록</h3>
        <button class="btn-close-modal" id="closeModalBtn">&times;</button>
      </div>

      <form id="userForm">
        <input type="hidden" id="editUserId">

        <div class="form-grid-2">
          <div class="form-group">
            <label>이름 (로그인 ID 겸용) *</label>
            <input type="text" id="newUsername" placeholder="예: 홍길동" required>
          </div>
          <div class="form-group">
            <label id="passwordLabel">비밀번호 *</label>
            <input type="password" id="newPassword" placeholder="비밀번호 입력">
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>권한</label>
            <select id="newRole">
              <option value="user">일반 회원</option>
              <option value="admin">관리자 (Admin)</option>
            </select>
          </div>
          <div class="form-group">
            <label>계약 형태</label>
            <select id="newContractType">
              <option value="정규직">정규직</option>
              <option value="계약직">계약직</option>
              <option value="아르바이트">아르바이트</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="newJobTitle">직책</label>
          <select id="newJobTitle">
            <option value="사원">사원</option>
            <option value="부소장">부소장</option>
            <option value="소장">소장</option>
          </select>
        </div>

        <div class="form-group" id="employmentStatusGroup" style="display: none;">
          <label>재직 여부</label>
          <select id="newStatus">
            <option value="재직">재직</option>
            <option value="퇴직">퇴직</option>
          </select>
        </div>

        <div class="form-group">
          <label>근무지 *</label>
          <input type="text" id="newWorkLocation" placeholder="예: 스키장 야간 / 현관" required>
        </div>

        <div class="form-grid-2">
          <div class="form-group">
            <label>입사일</label>
            <input type="date" id="newHireDate">
          </div>
          <div class="form-group">
            <label>연차 기준일</label>
            <input type="date" id="newAnnualBaseDate">
          </div>
        </div>

        <div class="form-group">
          <label>연락처</label>
          <input type="tel" id="newPhone" placeholder="010-0000-0000">
        </div>

        <!-- 컬러 피커 입력 영역 -->
        <div class="form-group">
          <label>회원 색상</label>
          <div style="display: flex; align-items: center; gap: 10px;">
            <input type="color" id="newColor" value="#38bdf8" style="width: 50px; height: 44px; padding: 4px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; cursor: pointer;">
            <span id="colorHexText" style="font-size: 14px; font-family: monospace; color: var(--text-sub);">#38bdf8</span>
          </div>
        </div>

        <div class="modal-btn-group">
          <button type="button" class="btn-delete-user" id="deleteUserBtn">삭제</button>
          <button type="submit" class="btn-submit-user" id="submitUserBtn">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JS 스크립트 연결 순서 -->
  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script>window.Swal = window.Sweetalert2;</script>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
