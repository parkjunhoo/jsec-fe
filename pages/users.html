<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 회원 조회</title>
  <!-- Supabase JS SDK CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* 본문 컨텐츠 영역 */
    .container {
      padding: 20px 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* 검색창 & 등록버튼 세트 */
    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-input {
      flex: 1;
      height: 48px;
      padding: 0 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn-add-user {
      background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    /* 회원 목록 카드 스타일 */
    .user-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .user-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-name-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      font-size: 17px;
      font-weight: 700;
    }

    .role-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .role-badge.admin {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .role-badge.user {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .status-badge {
      font-size: 12px;
      color: #4ade80;
      font-weight: 600;
    }

    .user-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      font-size: 13px;
      color: var(--text-sub);
      background: rgba(15, 23, 42, 0.4);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .user-details div span {
      color: var(--text-main);
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      padding: 40px 0;
      color: var(--text-sub);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- 공통 상단바 & 햄버거 메뉴 바인딩 위치 -->
  <div id="navbar"></div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="container">
    <div class="top-actions">
      <input type="text" id="searchInput" class="search-input" placeholder="회원 이름 또는 근무지 검색...">
      <button class="btn-add-user" id="addUserBtn" style="display: none;">+ 회원 등록</button>
    </div>

    <div class="user-list" id="userList">
      <div class="empty-state">회원 정보를 불러오는 중...</div>
    </div>
  </main>

  <!-- JS 스크립트 연결 순서 -->
  <script src="/js/supabase.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/users.js"></script>
</body>
</html>
