<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111815">
  <title>지산리조트 보안팀 - 물품 신청</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    .request-shell { width: min(1080px, 100%); margin: 0 auto; padding: 24px clamp(14px, 3vw, 28px) 48px; }
    .request-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
    .request-kicker { margin: 0 0 6px; color: var(--primary); font-size: 11px; font-weight: 750; letter-spacing: 0.12em; }
    .request-heading h1 { margin: 0; color: var(--text-main); font-size: 25px; font-weight: 760; }
    .request-heading p { margin: 6px 0 0; color: var(--text-sub); font-size: 13px; }
    .request-card { border: 1px solid var(--app-border); border-radius: 14px; background: var(--app-surface); box-shadow: var(--app-shadow); }
    .request-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 20px; }
    .request-field { display: grid; align-content: start; gap: 7px; min-width: 0; }
    .request-field.full { grid-column: 1 / -1; }
    .request-field label { color: var(--text-main); font-size: 13px; font-weight: 700; }
    .request-field label span { color: var(--text-sub); font-size: 11px; font-weight: 500; }
    .request-input, .request-textarea {
      width: 100%;
      min-height: 43px;
      padding: 10px 12px;
      border: 1px solid var(--app-border);
      border-radius: 9px;
      background: var(--input-bg);
      color: var(--text-main);
      font: inherit;
      font-size: 14px;
    }
    .request-textarea { min-height: 88px; resize: vertical; line-height: 1.55; }
    .request-input::placeholder, .request-textarea::placeholder { color: var(--text-sub); opacity: 0.75; }
    .request-submit {
      min-height: 43px;
      justify-self: start;
      padding: 0 18px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(135deg, #65b58b, #367b59);
      color: #fff;
      font: inherit;
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .request-submit:disabled, .request-action:disabled { cursor: wait; opacity: 0.6; }
    .request-form-error, .request-list-error { grid-column: 1 / -1; margin: 0; color: var(--danger); font-size: 13px; }
    .link-preview {
      display: flex;
      min-height: 82px;
      align-items: center;
      gap: 13px;
      padding: 13px 15px;
      border: 1px solid var(--app-border);
      border-radius: 11px;
      background: var(--app-surface-raised);
      color: inherit;
      text-decoration: none;
    }
    .link-preview[hidden] { display: none; }
    .link-preview-icon { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border-radius: 10px; background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); font-size: 18px; }
    .link-preview-copy { display: grid; min-width: 0; gap: 4px; }
    .link-preview-domain { color: var(--text-main); font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .link-preview-url { color: var(--text-sub); font-size: 11px; overflow-wrap: anywhere; }
    .link-preview-open { margin-left: auto; color: var(--primary); font-size: 19px; }
    .request-list-section { margin-top: 28px; }
    .request-list-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .request-list-heading h2 { margin: 0; color: var(--text-main); font-size: 18px; font-weight: 750; }
    .request-list-heading p { margin: 5px 0 0; color: var(--text-sub); font-size: 12px; }
    .request-filter { min-height: 38px; padding: 0 10px; border: 1px solid var(--app-border); border-radius: 8px; background: var(--app-surface); color: var(--text-main); font: inherit; font-size: 12px; }
    .request-list { display: grid; gap: 11px; }
    .request-item { min-width: 0; padding: 16px; border: 1px solid var(--app-border); border-radius: 13px; background: var(--app-surface); box-shadow: var(--app-shadow); }
    .request-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .request-item-title { margin: 0; color: var(--text-main); font-size: 16px; font-weight: 760; overflow-wrap: anywhere; }
    .request-item-meta { margin-top: 5px; color: var(--text-sub); font-size: 12px; line-height: 1.5; }
    .request-status { flex: 0 0 auto; padding: 5px 9px; border: 1px solid var(--app-border); border-radius: 999px; color: var(--text-sub); font-size: 11px; font-weight: 750; }
    .request-status.pending { border-color: rgba(230, 170, 70, 0.28); background: rgba(230, 170, 70, 0.1); color: #e8bd68; }
    .request-status.approved { border-color: rgba(76, 177, 120, 0.3); background: rgba(76, 177, 120, 0.1); color: #70c992; }
    .request-status.rejected { border-color: rgba(221, 95, 95, 0.3); background: rgba(221, 95, 95, 0.1); color: #ed8989; }
    .request-details { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px 14px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--app-border); }
    .request-detail { min-width: 0; color: var(--text-sub); font-size: 12px; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
    .request-detail strong { color: var(--text-main); font-weight: 650; }
    .request-item-link { display: inline-flex; margin-top: 12px; color: var(--primary); font-size: 12px; font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
    .request-item-link:hover { text-decoration: underline; }
    .request-review { display: grid; gap: 9px; margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--app-border); }
    .request-review textarea { width: 100%; min-height: 62px; padding: 9px 10px; border: 1px solid var(--app-border); border-radius: 8px; background: var(--input-bg); color: var(--text-main); font: inherit; font-size: 12px; resize: vertical; }
    .request-review-actions { display: flex; justify-content: flex-end; gap: 7px; }
    .request-action { min-height: 34px; padding: 0 12px; border: 1px solid var(--app-border); border-radius: 8px; background: transparent; color: var(--text-main); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .request-action.approve { border-color: rgba(76, 177, 120, 0.3); background: rgba(76, 177, 120, 0.1); color: #70c992; }
    .request-action.reject { border-color: rgba(221, 95, 95, 0.3); background: rgba(221, 95, 95, 0.1); color: #ed8989; }
    .request-delete-actions { margin-top: 10px; }
    .request-empty { padding: 28px 14px; border: 1px dashed var(--app-border); border-radius: 12px; color: var(--text-sub); font-size: 13px; text-align: center; }
    @media (max-width: 600px) {
      .request-shell { padding-top: 19px; }
      .request-heading h1 { font-size: 22px; }
      .request-form { grid-template-columns: minmax(0, 1fr); gap: 12px; padding: 15px; }
      .request-field.full { grid-column: auto; }
      .request-submit { width: 100%; }
      .request-details { grid-template-columns: minmax(0, 1fr); gap: 7px; }
      .request-item { padding: 13px; }
    }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="request-shell">
    <header class="request-heading">
      <div>
        <p class="request-kicker">JISAN SECURITY TEAM</p>
        <h1>물품 신청</h1>
        <p id="requestIntro">필요한 물품을 신청하면 관리자 검토 후 처리됩니다.</p>
      </div>
    </header>

    <form class="request-card request-form" id="itemRequestForm">
      <div class="request-field">
        <label for="itemName">물품명 *</label>
        <input class="request-input" id="itemName" name="item_name" maxlength="100" placeholder="예: 무전기 이어마이크" required>
      </div>
      <div class="request-field">
        <label for="itemQuantity">수량 *</label>
        <input class="request-input" id="itemQuantity" name="quantity" type="number" min="1" max="9999" step="1" value="1" required>
      </div>
      <div class="request-field full">
        <label for="itemSpecification">규격 <span>선택 사항</span></label>
        <textarea class="request-textarea" id="itemSpecification" name="specification" maxlength="500" placeholder="크기, 색상, 모델명 등 필요한 규격을 입력해 주세요."></textarea>
      </div>
      <div class="request-field full">
        <label for="itemReason">신청 사유 <span>선택 사항</span></label>
        <textarea class="request-textarea" id="itemReason" name="reason" maxlength="1000" placeholder="필요한 이유나 사용 목적을 적어 주세요."></textarea>
      </div>
      <div class="request-field full">
        <label for="itemExampleUrl">예시 링크 <span>선택 사항 · 입력하면 미리보기 카드가 표시됩니다.</span></label>
        <input class="request-input" id="itemExampleUrl" name="example_url" type="url" maxlength="2048" placeholder="https://example.com/product">
        <a class="link-preview" id="itemLinkPreview" target="_blank" rel="noopener noreferrer" hidden>
          <span class="link-preview-icon" aria-hidden="true">↗</span>
          <span class="link-preview-copy">
            <span class="link-preview-domain" id="itemLinkDomain"></span>
            <span class="link-preview-url" id="itemLinkUrl"></span>
          </span>
          <span class="link-preview-open" aria-hidden="true">↗</span>
        </a>
      </div>
      <p class="request-form-error" id="requestFormError" role="alert" hidden></p>
      <button class="request-submit" id="requestSubmit" type="submit">물품 신청하기</button>
    </form>

    <section class="request-list-section" aria-labelledby="requestListTitle">
      <header class="request-list-heading">
        <div>
          <h2 id="requestListTitle">내 신청 내역</h2>
          <p id="requestListDescription">내가 신청한 물품의 처리 상태입니다.</p>
        </div>
        <select class="request-filter" id="requestStatusFilter" aria-label="신청 상태 필터" hidden>
          <option value="">전체 상태</option>
          <option value="pending">검토 대기</option>
          <option value="approved">승인</option>
          <option value="rejected">반려</option>
        </select>
      </header>
      <p class="request-list-error" id="requestListError" role="alert" hidden></p>
      <div class="request-list" id="requestList" aria-live="polite">
        <div class="request-empty">신청 내역을 불러오는 중입니다.</div>
      </div>
    </section>
  </main>
  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script>window.Swal = window.Sweetalert2;</script>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/item-requests.js"></script>
</body>
</html>
