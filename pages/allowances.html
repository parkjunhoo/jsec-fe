<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111815">
  <title>지산리조트 보안팀 - 기능 안내</title>
  <link rel="stylesheet" href="/css/app-theme.css">
  <style>
    body { min-height: 100vh; margin: 0; background: var(--bg-main); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif; }
    .disabled-notice { width: min(640px, calc(100% - 32px)); margin: 48px auto; padding: 28px; border: 1px solid var(--app-border); border-radius: 16px; background: var(--app-surface); text-align: center; }
    .disabled-notice h1 { margin: 0; font-size: 22px; }
    .disabled-notice p { margin: 12px 0 20px; color: var(--text-sub); line-height: 1.7; }
    .disabled-notice a { color: var(--primary); font-weight: 700; }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <main class="disabled-notice">
    <h1>수당 관리 기능 비활성화</h1>

    <a href="/pages/main.html">메인 메뉴로 돌아가기</a>
  </main>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
</body>
</html>
