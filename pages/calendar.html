<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 휴무 캘린더</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
    .container { padding: 16px; max-width: 680px; margin: 0 auto; }

    .header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .header-area h2 { font-size: 18px; font-weight: 750; }
    .btn-add-vacation { height: 38px; padding: 0 12px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* --- 세련된 필터 박스 디자인 --- */
    .filter-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .filter-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      position: relative;
      cursor: pointer;
    }

    .filter-chip input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .chip-label {
      display: inline-block;
      padding: 5px 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .filter-chip input:checked + .chip-label {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* 월 이동 네비게이션 */
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px 16px; margin-bottom: 14px; }
    .calendar-nav button { background: none; border: none; color: var(--primary); font-size: 15px; font-weight: bold; cursor: pointer; padding: 4px 8px; }
    .calendar-nav span { font-size: 16px; font-weight: 700; }

    /* 달력 그리드 스타일 */
    .calendar-grid {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day-name {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.4);
    }
    .day-name:nth-child(1) { color: #f87171; }
    .day-name:nth-child(7) { color: #60a5fa; }

    .calendar-cell {
      min-height: 115px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.15s;
      overflow: hidden;
    }
    .calendar-cell:hover { background: rgba(56, 189, 248, 0.05); }
    .calendar-cell.other-month { opacity: 0.35; }
    .calendar-cell.today { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); }

    .cell-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .calendar-cell:nth-child(7n+1) .cell-date { color: #f87171; }
    .calendar-cell:nth-child(7n) .cell-date { color: #60a5fa; }
    .calendar-cell.today .cell-date { background: var(--primary); color: #0f172a; }

    .cell-events {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      overflow-y: auto;
      max-height: 84px;
    }
    .cell-events::-webkit-scrollbar { width: 2px; }
    .cell-events::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

    /* 컴팩트한 이름 칩 스타일 (컬러 테두리/배경 반영) */
    .event-pill {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.2;
    }

    /* 모달 및 폼 스타일 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 300; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px; padding: 24px 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
    @media (min-width: 600px) { .modal-card { border-radius: 20px; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h3 { font-size: 18px; font-weight: 700; color: #fff; }
    .btn-close-modal { background: none; border: none; color: var(--text-sub); font-size: 24px; cursor: pointer; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; height: 44px; padding: 0 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    
    .modal-btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn-submit { flex: 1; height: 46px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-delete { height: 46px; padding: 0 18px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: none; }
  </style>
</head>
<body>

  <div id="navbar"></div>

  <main class="container">
    <div class="header-area">
      <h2>📅 보안팀 휴무 캘린더</h2>
      <button class="btn-add-vacation" id="openModalBtn">+ 휴무 등록</button>
    </div>

    <!-- 💡 필터 및 정렬 박스 추가 (백맨/현관 통합, 통제실 제외) -->
    <div class="filter-box">
      <div class="filter-row">
        <span class="filter-title">정렬 기준</span>
        <select id="sortSelect" class="sort-select">
          <option value="name_asc">이름순 (가나다)</option>
        </select>
      </div>

      <div>
        <span class="filter-title" style="display: block; margin-bottom: 6px;">근무지 및 주·야간 필터 (다중 선택)</span>
        <div class="filter-chips">
          <label class="filter-chip">
            <input type="checkbox" name="locFilter" value="주간" checked>
            <span class="chip-label">☀️ 주간 전체</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="locFilter" value="야간" checked>
            <span class="chip-label">🌙 야간 전체</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="locFilter" value="스키장" checked>
            <span class="chip-label">⛷️ 스키장</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="locFilter" value="골프장" checked>
            <span class="chip-label">⛳ 골프장</span>
          </label>
          <label class="filter-chip">
            <input type="checkbox" name="locFilter" value="백맨/현관" checked>
            <span class="chip-label">🚪 백맨/현관</span>
          </label>
        </div>
      </div>
    </div>

    <div class="calendar-nav">
      <button id="prevMonthBtn">&lt; 이전달</button>
      <span id="currentMonthDisplay">2026년 6월</span>
      <button id="nextMonthBtn">다음달 &gt;</button>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </main>

  <div class="modal-overlay" id="vacationModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">휴무 일정 등록</h3>
        <button class="btn-close-modal" id="closeModalBtn">&times;</button>
      </div>

      <form id="vacationForm">
        <input type="hidden" id="editVacationId">

        <div class="form-group">
          <label>휴무 날짜 *</label>
          <input type="date" id="vDate" required>
        </div>

        <div class="form-group">
          <label>휴무 구분 *</label>
          <select id="vLeaveType">
            <option value="휴무">휴무 (정기오프)</option>
            <option value="연차">연차</option>
            <option value="시간차">시간차 (반차/조퇴 등)</option>
          </select>
        </div>

        <div class="form-group">
          <label>세부 시간 *</label>
          <select id="vTimeDetail">
            <option value="종일">종일</option>
            <option value="오전반차">오전반차</option>
            <option value="오후반차">오후반차</option>
            <option value="시간지정">시간지정</option>
          </select>
        </div>

        <div class="form-group">
          <label>비고 / 메모</label>
          <input type="text" id="vMemo" placeholder="특이사항 입력 (선택)">
        </div>

        <div class="modal-btn-group">
          <button type="button" class="btn-delete" id="deleteBtn">삭제</button>
          <button type="submit" class="btn-submit" id="submitBtn">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/supabase.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
