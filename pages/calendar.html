<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>지산리조트 보안팀 - 휴무 캘린더</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --input-bg: rgba(15, 23, 42, 0.6);
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }
    .container { padding: 16px; max-width: 680px; margin: 0 auto; }

    .header-area { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
    .header-area h2 { font-size: 18px; font-weight: 750; }
    .btn-add-vacation { height: 38px; padding: 0 12px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #fff; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .header-actions { display: flex; gap: 8px; }
    .btn-export-excel { height: 38px; padding: 0 12px; background: rgba(34, 197, 94, 0.16); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.35); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }

    /* --- 필터 박스 디자인 --- */
    .filter-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .filter-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-chip {
      position: relative;
      cursor: pointer;
    }

    .filter-chip input {
      position: absolute;
      opacity: 0;
      cursor: pointer;
    }

    .chip-label {
      display: inline-block;
      padding: 5px 10px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-sub);
      transition: all 0.2s ease;
    }

    .filter-chip input:checked + .chip-label {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--primary);
      color: var(--primary);
      font-weight: 600;
    }

    /* 월 이동 네비게이션 */
    .calendar-nav { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 14px; padding: 10px 16px; margin-bottom: 14px; }
    .calendar-nav button { background: none; border: none; color: var(--primary); font-size: 15px; font-weight: bold; cursor: pointer; padding: 4px 8px; }
    .calendar-nav span { font-size: 16px; font-weight: 700; }

    /* 달력 그리드 스타일 */
    .calendar-grid {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 24px;
    }

    .day-name {
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      background: rgba(15, 23, 42, 0.4);
    }
    .day-name:nth-child(1) { color: #f87171; }
    .day-name:nth-child(7) { color: #60a5fa; }

    .calendar-cell {
      min-height: 125px;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding: 4px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.15s;
      overflow: hidden;
    }
    .calendar-cell:hover { background: rgba(56, 189, 248, 0.05); }
    .calendar-cell.other-month { opacity: 0.35; }
    .calendar-cell.today { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); }

    .cell-date {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      width: 100%;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 4px;
      flex-shrink: 0;
    }
    .cell-date > span:first-child { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 50%; flex-shrink: 0; }
    .calendar-note-indicator { font-size: 13px; line-height: 1; }
    .calendar-note-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fde68a; font-size: 10px; font-weight: 600; }
    .calendar-cell:nth-child(7n+1) .cell-date { color: #f87171; }
    .calendar-cell:nth-child(7n) .cell-date { color: #60a5fa; }
    .calendar-cell.today .cell-date > span:first-child { background: var(--primary); color: #0f172a; }

    .cell-events {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      overflow-y: auto;
      max-height: 94px;
    }
    .cell-events::-webkit-scrollbar { width: 2px; }
    .cell-events::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }

    .event-pill {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      white-space: nowrap;
      line-height: 1.3;
    }

    /* --- 월간 통계 대시보드 스타일 --- */
    .stats-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stats-header {
      font-size: 14px;
      font-weight: 750;
      color: var(--text-main);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .stat-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-name {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .stat-badges {
      display: flex;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
    }

    .stat-badge-item {
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .stat-badge-item span {
      color: var(--primary);
      font-weight: 700;
    }

    .stat-dates {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .stat-dates-title {
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
    }

    .stat-dates-list {
      color: var(--primary);
      font-family: monospace;
      font-weight: 650;
      overflow-x: auto;
      white-space: nowrap;
    }

    /* 모달 및 폼 스타일 */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); backdrop-filter: blur(6px); z-index: 300; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #1e293b; border: 1px solid var(--border-color); border-radius: 24px 24px 0 0; width: 100%; max-width: 460px; padding: 24px 20px; max-height: 85vh; overflow-y: auto; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); }
    @media (min-width: 600px) { .modal-card { border-radius: 20px; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .modal-header h3 { font-size: 18px; font-weight: 700; color: #fff; }
    .btn-close-modal { background: none; border: none; color: var(--text-sub); font-size: 24px; cursor: pointer; }
    .modal-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .modal-tab { flex: 1; height: 40px; background: var(--input-bg); color: var(--text-sub); border: 1px solid var(--border-color); border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; }
    .modal-tab.active { background: rgba(56, 189, 248, 0.15); color: var(--primary); border-color: var(--primary); }
    .emoji-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .emoji-choice { height: 38px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; font-size: 20px; cursor: pointer; }
    .emoji-choice.selected { border-color: var(--primary); background: rgba(56, 189, 248, 0.15); }
    .emoji-choice:disabled { cursor: default; opacity: 1; }
    .form-group textarea { width: 100%; min-height: 110px; resize: vertical; padding: 12px 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; }
    .form-group input, .form-group select { width: 100%; height: 44px; padding: 0 14px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    
    .modal-btn-group { display: flex; gap: 10px; margin-top: 16px; }
    .btn-submit { flex: 1; height: 46px; background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .btn-delete { height: 46px; padding: 0 18px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer; display: none; }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="container">
    <div class="header-area">
      <h2>📅 보안팀 휴무 캘린더</h2>
      <div class="header-actions">
        <button class="btn-export-excel" id="exportExcelBtn" type="button">엑셀 내보내기</button>
        <button class="btn-add-vacation" id="openModalBtn" type="button">+ 휴무 등록</button>
      </div>
    </div>

    <!-- 필터 및 정렬 박스 -->
    <div class="filter-box">
      <!-- 1. 근무지/주야간 필터 섹션 -->
      <div class="filter-section">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <span class="filter-title">근무지 및 근무시간</span>
          <button type="button" id="selectAllLocBtn" style="background: none; border: none; color: var(--primary); font-size: 11px; font-weight: 700; cursor: pointer; padding: 2px 4px;">전체 해제</button>
        </div>
        <div class="filter-groups">
          <div class="filter-group">
            <span class="filter-group-label">근무시간</span>
            <div class="filter-chips">
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="주간" checked>
                <span class="chip-label">주간</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="야간" checked>
                <span class="chip-label">야간</span>
              </label>
            </div>
          </div>
          <div class="filter-group">
            <span class="filter-group-label">근무지</span>
            <div class="filter-chips">
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="스키장" checked>
                <span class="chip-label">스키장</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="골프장" checked>
                <span class="chip-label">골프장</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="현관" checked>
                <span class="chip-label">현관</span>
              </label>
              <label class="filter-chip">
                <input type="checkbox" name="locFilter" value="other" checked>
                <span class="chip-label">기타</span>
              </label>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div class="calendar-nav">
      <button id="prevMonthBtn">&lt; 이전달</button>
      <span id="currentMonthDisplay">2026년 6월</span>
      <button id="nextMonthBtn">다음달 &gt;</button>
    </div>

    <!-- 캘린더 그리드 -->
    <div class="calendar-grid" id="calendarGrid"></div>

    <!-- 월간 휴무 사용 통계 대시보드 -->
    <div class="stats-container">
      <div class="stats-header">
        <span>📊 이번 달 팀원별 휴무/연차 통계</span>
        <span id="totalMonthVacationCount" style="font-size: 12px; color: var(--primary);">총 0건 사용</span>
      </div>
      <div class="stats-grid" id="statsGridContainer">
        <div style="color: var(--text-sub); font-size: 13px; text-align: center; padding: 20px;">데이터를 불러오는 중...</div>
      </div>
    </div>
  </main>

  <div class="modal-overlay" id="vacationModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">휴무 일정 등록</h3>
        <button class="btn-close-modal" id="closeModalBtn">&times;</button>
      </div>

      <form id="vacationForm">
        <input type="hidden" id="editVacationId">
        <input type="hidden" id="editCalendarNote">

        <div class="form-group">
          <label id="modalDateLabel">휴무 날짜 *</label>
          <input type="date" id="vDate" required>
        </div>

        <div class="modal-tabs">
          <button type="button" class="modal-tab active" data-modal-tab="schedule">휴무 일정</button>
          <button type="button" class="modal-tab" data-modal-tab="note">📝 달력 메모</button>
        </div>

        <div id="scheduleTabPanel">
          <div class="form-group" id="targetUserFormGroup" style="display: none;">
            <label>대상 팀원 선택 (관리자 전용) *</label>
            <select id="vTargetUserId" required></select>
          </div>

          <div class="form-group">
            <label>휴무 종류 *</label>
            <select id="vLeaveType" required>
              <option value="휴무">휴무</option>
              <option value="연차">연차</option>
              <option value="시간차">시간차</option>
            </select>
          </div>

          <div class="form-group">
            <label>세부 시간 *</label>
            <select id="vTimeDetail">
              <option value="종일">종일</option>
              <option value="시간지정">N시간 사용</option>
            </select>
          </div>

          <div class="form-group" id="vHoursUsedGroup" style="display: none;">
            <label for="vHoursUsed">사용 시간 *</label>
            <input type="number" id="vHoursUsed" min="0.25" max="24" step="0.25" placeholder="예: 4">
          </div>

          <div class="form-group">
            <label>비고 / 메모</label>
            <input type="text" id="vMemo" placeholder="특이사항 입력 (선택)">
          </div>
        </div>

        <div id="noteTabPanel" style="display: none;">
          <div class="form-group">
            <label>이모지 선택</label>
            <div class="emoji-picker" id="calendarNoteEmojiPicker"></div>
          </div>
          <div class="form-group">
            <label for="calendarNoteContent">메모 (최대 500자)</label>
            <textarea id="calendarNoteContent" maxlength="500" placeholder="이 날짜에 표시할 메모를 입력해 주세요."></textarea>
          </div>
        </div>

        <div class="modal-btn-group">
          <button type="button" class="btn-delete" id="deleteBtn">삭제</button>
          <button type="submit" class="btn-submit" id="submitBtn">등록 완료</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script>window.Swal = window.Sweetalert2;</script>
  <script src="/lib/sheetjs/xlsx.full.min.js"></script>
  <script src="/lib/jszip/jszip.min.js"></script>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/calendar.js"></script>
</body>
</html>
