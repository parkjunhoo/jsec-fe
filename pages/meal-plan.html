<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111815">
  <title>지산리조트 보안팀 - 주간 식단표</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: 36px;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
    }
    button { font: inherit; }
    .meal-shell { width: min(900px, 100%); margin: 0 auto; padding: 28px 22px 0; }
    .meal-intro { margin-bottom: 22px; }
    .meal-kicker { margin: 0 0 9px; color: var(--primary); font-size: 11px; font-weight: 800; letter-spacing: 0.16em; }
    .meal-intro h1 { margin: 0; font-size: clamp(25px, 5vw, 34px); letter-spacing: -0.045em; }
    .meal-intro p { margin: 9px 0 0; color: var(--text-sub); font-size: 14px; line-height: 1.65; }
    .meal-card { overflow: hidden; border: 1px solid var(--app-border); border-radius: 18px; background: var(--app-surface); box-shadow: var(--app-shadow); }
    .week-nav { display: flex; min-height: 76px; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--app-border); }
    .week-nav button, .meal-action {
      min-height: 40px;
      border: 1px solid var(--app-border);
      border-radius: 10px;
      background: var(--app-surface-raised);
      color: var(--text-main);
      cursor: pointer;
    }
    .week-nav button { width: 42px; flex: 0 0 42px; font-size: 20px; }
    .week-nav button:hover:not(:disabled), .meal-action:hover:not(:disabled) { border-color: var(--primary); }
    .week-nav button:disabled, .meal-action:disabled { cursor: wait; opacity: 0.55; }
    .week-label { min-width: 0; text-align: center; }
    .week-label strong { display: block; font-size: 15px; }
    .week-label span { display: block; margin-top: 4px; color: var(--text-sub); font-size: 11px; }
    .meal-content { padding: 18px; }
    .meal-status { min-height: 22px; margin: 0 0 12px; color: var(--text-sub); font-size: 13px; line-height: 1.55; }
    .meal-status[data-type="error"] { color: var(--danger); }
    .meal-status[data-type="success"] { color: var(--primary); }
    .meal-photo-frame { display: grid; min-height: 220px; place-items: center; overflow: hidden; border: 1px dashed var(--app-border); border-radius: 13px; background: var(--app-surface-raised); }
    .meal-photo-frame[hidden] { display: none; }
    .meal-photo { display: block; width: 100%; max-height: min(72vh, 900px); object-fit: contain; background: var(--app-surface-raised); cursor: zoom-in; }
    .meal-empty { padding: 44px 20px; color: var(--text-sub); font-size: 13px; text-align: center; line-height: 1.7; }
    .meal-empty strong { display: block; margin-bottom: 6px; color: var(--text-main); font-size: 15px; }
    .meal-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 9px; margin-top: 14px; }
    .meal-action { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; font-size: 12px; font-weight: 700; }
    .meal-action-icon { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.7; }
    .meal-action-primary { border-color: var(--primary); background: var(--primary); color: #14251c; }
    .meal-action[hidden] { display: none; }
    .meal-help { margin: 13px 0 0; color: var(--text-sub); font-size: 11px; line-height: 1.6; }
    .meal-viewer {
      width: min(1100px, calc(100% - 24px));
      max-width: none;
      height: min(94dvh, 1000px);
      max-height: none;
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--app-border);
      border-radius: 16px;
      background: var(--app-surface);
      color: var(--text-main);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }
    .meal-viewer::backdrop { background: rgba(2, 8, 16, 0.82); }
    .meal-viewer-layout { display: flex; width: 100%; height: 100%; flex-direction: column; }
    .meal-viewer-toolbar { display: flex; min-height: 58px; flex: 0 0 auto; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--app-border); }
    .meal-viewer-tools { display: flex; min-width: 0; align-items: center; gap: 7px; }
    .meal-viewer-title { min-width: 0; overflow: hidden; color: var(--text-main); font-size: 13px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .meal-viewer-button {
      display: inline-flex;
      min-width: 38px;
      min-height: 38px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      border: 1px solid var(--app-border);
      border-radius: 9px;
      background: var(--app-surface-raised);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .meal-viewer-button:hover { border-color: var(--primary); }
    .meal-viewer-zoom { min-width: 44px; color: var(--text-sub); font-size: 11px; text-align: center; }
    .meal-viewer-stage { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y; background: #080d14; }
    .meal-viewer-image { display: block; max-width: none; max-height: none; margin: 0 auto; }
    @media (max-width: 540px) {
      .meal-shell { padding: 22px 14px 0; }
      .week-nav { padding: 12px; }
      .meal-content { padding: 13px; }
      .meal-photo-frame { min-height: 180px; }
      .meal-actions .meal-action { flex: 1; }
      .meal-viewer { width: 100%; height: 100dvh; border: 0; border-radius: 0; }
      .meal-viewer-toolbar { gap: 5px; padding: 8px; }
      .meal-viewer-tools { gap: 5px; }
      .meal-viewer-title { max-width: 85px; font-size: 11px; }
      .meal-viewer-button { min-width: 34px; min-height: 36px; padding: 0 8px; }
    }
    html[data-theme="light"] .meal-action-primary { color: #fff; }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>
  <div id="navbar"></div>
  <main class="meal-shell">
    <header class="meal-intro">
      <p class="meal-kicker">WEEKLY MENU</p>
      <h1>주간 식단표</h1>
      <p>이번 주 식단표 사진을 확인하고, 사진을 찍어 공유할 수 있습니다.<br>새 사진을 올리면 같은 주의 기존 식단표가 교체됩니다.</p>
    </header>
    <section class="meal-card" aria-label="주간 식단표">
      <nav class="week-nav" aria-label="주간 식단표 주 선택">
        <button id="previousWeek" type="button" aria-label="이전 주">‹</button>
        <div class="week-label">
          <strong id="weekRange">불러오는 중</strong>
          <span id="weekStart"></span>
        </div>
        <button id="nextWeek" type="button" aria-label="다음 주">›</button>
      </nav>
      <div class="meal-content">
        <p class="meal-status" id="mealStatus" role="status" aria-live="polite"></p>
        <div class="meal-photo-frame" id="mealPhotoFrame" hidden>
          <img class="meal-photo" id="mealPhoto" alt="선택한 주의 식단표 사진">
        </div>
        <div class="meal-empty" id="mealEmpty" hidden>
          <strong>아직 등록된 식단표가 없습니다.</strong>
          이 주의 식단표 사진을 먼저 올려 주세요.
        </div>
        <div class="meal-actions">
          <button class="meal-action" id="chooseMealPhoto" type="button"><svg class="meal-action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 선택</button>
          <button class="meal-action meal-action-primary" id="uploadMealPhoto" type="button" hidden>이 주 식단표 올리기</button>
          <button class="meal-action" id="cancelMealPhoto" type="button" hidden>취소</button>
          <input id="mealPhotoInput" type="file" accept="image/*" capture="environment" hidden>
        </div>
        <p class="meal-help">사진은 기기에서 JPEG로 압축한 뒤 업로드됩니다. 최대 1MB이며, 같은 주에 다시 올리면 기존 사진을 교체합니다.</p>
      </div>
    </section>
  </main>
  <dialog class="meal-viewer" id="mealViewer" aria-label="식단표 사진 확대 보기">
    <div class="meal-viewer-layout">
      <div class="meal-viewer-toolbar">
        <span class="meal-viewer-title" id="mealViewerTitle">식단표 사진</span>
        <div class="meal-viewer-tools" aria-label="사진 보기 도구">
          <button class="meal-viewer-button" id="mealZoomOut" type="button" aria-label="축소">−</button>
          <span class="meal-viewer-zoom" id="mealZoomLabel" aria-live="polite">맞춤</span>
          <button class="meal-viewer-button" id="mealZoomIn" type="button" aria-label="확대">+</button>
          <button class="meal-viewer-button" id="mealZoomFit" type="button">맞춤</button>
          <a class="meal-viewer-button" id="mealDownload" href="#" download>↓ 저장</a>
          <button class="meal-viewer-button" id="closeMealViewer" type="button" aria-label="닫기">×</button>
        </div>
      </div>
      <div class="meal-viewer-stage" id="mealViewerStage">
        <img class="meal-viewer-image" id="mealViewerImage" alt="확대된 식단표 사진">
      </div>
    </div>
  </dialog>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/meal-plan.js"></script>
</body>
</html>
