<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">
  <title>지산리조트 보안팀 - 매뉴얼</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b1220;
      --panel: #121d2e;
      --panel-raised: #172438;
      --line: rgba(190, 211, 239, 0.11);
      --text: #f3f7fc;
      --muted: #92a2b8;
      --blue: #72c7ff;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: 28px;
      background:
        radial-gradient(ellipse at 82% -10%, rgba(26, 106, 157, 0.22), transparent 38rem),
        var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, a { font: inherit; }

    .manuals-shell { width: min(1120px, 100%); margin: 0 auto; padding: 28px 24px 0; }
    .intro { margin-bottom: 24px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.16em;
    }
    .eyebrow::before { width: 18px; height: 1px; background: currentColor; content: ""; }
    .intro h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -0.045em; }
    .intro p { margin: 9px 0 0; color: var(--muted); font-size: 14px; line-height: 1.6; }

    .manual-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .manual-choice {
      position: relative;
      display: flex;
      min-height: 100px;
      align-items: center;
      gap: 14px;
      padding: 17px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(23, 36, 56, 0.95), rgba(16, 27, 44, 0.94));
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }
    .manual-choice:hover { border-color: rgba(114, 199, 255, 0.42); transform: translateY(-1px); }
    .manual-choice[aria-selected="true"] {
      border-color: rgba(114, 199, 255, 0.72);
      background: linear-gradient(145deg, rgba(31, 66, 94, 0.9), rgba(19, 39, 60, 0.98));
      box-shadow: inset 0 0 0 1px rgba(114, 199, 255, 0.12), 0 10px 30px rgba(0, 0, 0, 0.16);
    }
    .manual-icon {
      display: grid;
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      place-items: center;
      border: 1px solid rgba(114, 199, 255, 0.16);
      border-radius: 14px;
      background: rgba(114, 199, 255, 0.09);
      font-size: 21px;
    }
    .manual-copy { min-width: 0; }
    .manual-name { display: block; font-size: 15px; font-weight: 750; letter-spacing: -0.025em; }
    .manual-caption { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
    .manual-check { position: absolute; top: 10px; right: 12px; color: var(--blue); font-size: 12px; opacity: 0; }
    .manual-choice[aria-selected="true"] .manual-check { opacity: 1; }

    .viewer-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #111b2a;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.2);
    }
    .viewer-head {
      display: flex;
      min-height: 72px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 18px;
      border-bottom: 1px solid var(--line);
    }
    .viewer-title { min-width: 0; }
    .viewer-title strong { display: block; overflow: hidden; font-size: 15px; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-title span { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .viewer-actions { display: flex; flex: 0 0 auto; gap: 8px; }
    .viewer-action {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.035);
      color: #dce8f6;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }
    .viewer-action:active { transform: scale(0.98); }
    .pdf-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.018);
    }
    .page-controls, .zoom-controls { display: flex; align-items: center; gap: 8px; }
    .pdf-control {
      display: inline-grid;
      min-width: 38px;
      height: 36px;
      place-items: center;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-raised);
      color: #e5eef9;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    .pdf-control:disabled { opacity: 0.4; cursor: default; }
    .page-indicator { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
    .page-input {
      width: 48px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: 0;
      background: #0c1523;
      color: var(--text);
      font: inherit;
      text-align: center;
    }
    .zoom-label { min-width: 42px; color: var(--muted); font-size: 11px; text-align: center; }
    .page-stage {
      display: flex;
      min-height: min(75vh, 900px);
      justify-content: center;
      align-items: flex-start;
      padding: 26px;
      overflow: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(45, 68, 97, 0.36), transparent 70%),
        #0d1624;
    }
    .pdf-page {
      display: block;
      flex: 0 0 auto;
      max-width: none;
      background: #fff;
      box-shadow: 0 14px 42px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .pdf-page[hidden], .page-stage[hidden] { display: none; }
    .viewer-status { margin: auto; padding: 28px 16px; color: var(--muted); font-size: 13px; text-align: center; }
    .viewer-status[hidden] { display: none; }
    .loading-indicator {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid rgba(146, 162, 184, 0.28);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .page-progress { height: 2px; background: rgba(255, 255, 255, 0.06); }
    .page-progress span { display: block; width: 0; height: 100%; background: var(--blue); transition: width 180ms ease; }
    .view-mode-toggle {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid rgba(114, 199, 255, 0.24);
      border-radius: 9px;
      background: rgba(56, 144, 199, 0.13);
      color: #9bd8ff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-overview {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      align-content: start;
      gap: 14px;
      min-height: min(65vh, 760px);
      max-height: 78vh;
      padding: 18px;
      overflow: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(45, 68, 97, 0.24), transparent 70%),
        #0d1624;
    }
    .page-overview[hidden] { display: none; }
    .page-thumb {
      display: flex;
      min-width: 0;
      min-height: 230px;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      overflow: hidden;
      border: 1px solid rgba(190, 211, 239, 0.1);
      border-radius: 12px;
      background: rgba(23, 36, 56, 0.75);
      color: var(--text);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }
    .page-thumb:hover, .page-thumb:focus-visible {
      border-color: rgba(114, 199, 255, 0.58);
      background: rgba(31, 55, 79, 0.92);
      transform: translateY(-2px);
      outline: 0;
    }
    .page-thumb-canvas-wrap {
      display: grid;
      width: 100%;
      height: 190px;
      flex: 1 1 auto;
      place-items: center;
      overflow: hidden;
      border-radius: 5px;
      background: rgba(4, 10, 18, 0.45);
    }
    .page-thumb canvas {
      display: block;
      max-width: 100%;
      max-height: 190px;
      background: #fff;
      box-shadow: 0 3px 9px rgba(0, 0, 0, 0.25);
    }
    .page-thumb-label { color: #aabbd0; font-size: 11px; font-weight: 650; }
    .page-thumb-skeleton {
      width: 44%;
      height: 68%;
      border-radius: 3px;
      background: linear-gradient(110deg, #e5eaf0 30%, #f5f7fa 45%, #e5eaf0 60%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }
    @keyframes shimmer { to { background-position-x: -200%; } }
    .viewer-note { margin: 11px 3px 0; color: #8292a9; font-size: 11px; line-height: 1.5; text-align: center; }

    @media (max-width: 700px) {
      .manuals-shell { padding: 22px 14px 0; }
      .intro { margin-bottom: 18px; }
      .intro p { max-width: 32rem; font-size: 13px; }
      .manual-grid {
        display: flex;
        gap: 9px;
        margin: 0 -14px 14px;
        padding: 2px 14px 8px;
        overflow-x: auto;
        scrollbar-width: none;
        scroll-snap-type: x mandatory;
      }
      .manual-grid::-webkit-scrollbar { display: none; }
      .manual-choice {
        min-width: min(76vw, 250px);
        min-height: 82px;
        padding: 13px;
        scroll-snap-align: start;
      }
      .manual-icon { width: 42px; height: 42px; flex-basis: 42px; border-radius: 13px; }
      .viewer-card { margin: 0 -2px; border-radius: 14px; }
      .viewer-head { min-height: 66px; padding: 10px 11px; gap: 8px; }
      .viewer-title strong { font-size: 13px; }
      .viewer-title span { font-size: 10px; }
      .viewer-actions { gap: 6px; }
      .viewer-action { min-height: 36px; padding: 0 9px; font-size: 11px; }
      .pdf-toolbar { padding: 8px 9px; }
      .page-controls, .zoom-controls { gap: 5px; }
      .pdf-control { min-width: 36px; height: 36px; padding: 0 8px; }
      .view-mode-toggle { padding: 0 8px; font-size: 10px; }
      .page-indicator { gap: 4px; font-size: 11px; }
      .page-input { width: 42px; height: 34px; }
      .page-stage { min-height: 58vh; padding: 13px 8px; }
      .page-overview {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
        min-height: 55vh;
        max-height: 70vh;
        padding: 11px;
      }
      .page-thumb { min-height: 205px; padding: 8px; }
      .page-thumb-canvas-wrap, .page-thumb canvas { max-height: 168px; }
      .viewer-note { padding: 0 10px; }
    }
    @media (max-width: 380px) {
      .viewer-action { width: 36px; padding: 0; font-size: 16px; }
      .viewer-action span { display: none; }
      .zoom-label { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
    }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="manuals-shell">
    <section class="intro" aria-labelledby="pageTitle">
      <div class="eyebrow">JISAN SECURITY · FIELD GUIDE</div>
      <h1 id="pageTitle">현장에서 바로 찾는 매뉴얼</h1>
      <p>필요한 매뉴얼을 선택하면 아래에서 바로 확인할 수 있습니다.</p>
    </section>

    <div class="manual-grid" role="tablist" aria-label="매뉴얼 선택">
      <button class="manual-choice" type="button" role="tab" id="tab-action" aria-controls="manualViewer" aria-selected="true" data-manual="action">
        <span class="manual-icon" aria-hidden="true">🛡️</span>
        <span class="manual-copy"><span class="manual-name">상황조치매뉴얼</span><span class="manual-caption">현장 대응 절차</span></span>
        <span class="manual-check" aria-hidden="true">●</span>
      </button>
      <button class="manual-choice" type="button" role="tab" id="tab-golf" aria-controls="manualViewer" aria-selected="false" data-manual="golf" tabindex="-1">
        <span class="manual-icon" aria-hidden="true">⛳</span>
        <span class="manual-copy"><span class="manual-name">골프장 매뉴얼</span><span class="manual-caption">골프장 근무 안내</span></span>
        <span class="manual-check" aria-hidden="true">●</span>
      </button>
      <button class="manual-choice" type="button" role="tab" id="tab-ski" aria-controls="manualViewer" aria-selected="false" data-manual="ski" tabindex="-1">
        <span class="manual-icon" aria-hidden="true">⛷️</span>
        <span class="manual-copy"><span class="manual-name">스키장 매뉴얼</span><span class="manual-caption">스키장 근무 안내</span></span>
        <span class="manual-check" aria-hidden="true">●</span>
      </button>
    </div>

    <section class="viewer-card" id="manualViewer" role="tabpanel" aria-labelledby="tab-action">
      <header class="viewer-head">
        <div class="viewer-title">
          <strong id="viewerName">상황조치매뉴얼</strong>
          <span id="pageSummary">페이지별 보기</span>
        </div>
        <div class="viewer-actions">
          <a class="viewer-action" id="downloadManual" href="/assets/action.pdf" download>↓ <span>저장</span></a>
        </div>
      </header>
      <div class="pdf-toolbar" aria-label="PDF 페이지 및 확대 조절">
        <div class="page-controls">
          <button class="pdf-control" id="previousPage" type="button" aria-label="이전 페이지">‹</button>
          <label class="page-indicator"><input class="page-input" id="pageNumber" type="number" min="1" value="1" aria-label="페이지 번호"><span>/ <span id="pageCount">—</span></span></label>
          <button class="pdf-control" id="nextPage" type="button" aria-label="다음 페이지">›</button>
          <button class="view-mode-toggle" id="viewModeToggle" type="button">1페이지 보기</button>
        </div>
        <div class="zoom-controls" aria-label="페이지 확대 조절">
          <button class="pdf-control" id="zoomOut" type="button" aria-label="축소">−</button>
          <span class="zoom-label" id="zoomLabel">맞춤</span>
          <button class="pdf-control" id="zoomIn" type="button" aria-label="확대">+</button>
        </div>
      </div>
      <div class="page-progress" aria-hidden="true"><span id="pageProgress"></span></div>
      <div class="viewer-status" id="viewerStatus"><span class="loading-indicator"></span>매뉴얼을 준비하고 있습니다.</div>
      <div class="page-overview" id="pageOverview" aria-label="전체 페이지 미리보기" hidden></div>
      <div class="page-stage" id="pageStage" aria-live="polite" hidden>
        <canvas class="pdf-page" id="pdfCanvas" hidden></canvas>
      </div>
    </section>
    <p class="viewer-note">전체 페이지를 작은 카드로 훑어보고, 필요한 페이지를 누르면 크게 읽을 수 있습니다. PDF 원본도 저장할 수 있습니다.</p>
  </main>

  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    (() => {
      const manuals = {
        action: { title: '상황조치매뉴얼', file: '/assets/action.pdf', tab: 'tab-action' },
        golf: { title: '골프장 매뉴얼', file: '/assets/golf.pdf', tab: 'tab-golf' },
        ski: { title: '스키장 매뉴얼', file: '/assets/ski.pdf', tab: 'tab-ski' }
      };
      const tabs = Array.from(document.querySelectorAll('[data-manual]'));
      const viewer = document.getElementById('manualViewer');
      const viewerName = document.getElementById('viewerName');
      const downloadLink = document.getElementById('downloadManual');
      const canvas = document.getElementById('pdfCanvas');
      const context = canvas.getContext('2d', { alpha: false });
      const stage = document.getElementById('pageStage');
      const overview = document.getElementById('pageOverview');
      const status = document.getElementById('viewerStatus');
      const pageNumberInput = document.getElementById('pageNumber');
      const pageCount = document.getElementById('pageCount');
      const pageSummary = document.getElementById('pageSummary');
      const previousButton = document.getElementById('previousPage');
      const nextButton = document.getElementById('nextPage');
      const zoomLabel = document.getElementById('zoomLabel');
      const progress = document.getElementById('pageProgress');
      const viewModeToggle = document.getElementById('viewModeToggle');
      const workerSource = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      let pdfDocument = null;
      let currentPage = 1;
      let zoom = 1;
      let viewMode = 'overview';
      let renderTask = null;
      let loadingTask = null;
      let loadGeneration = 0;
      let renderGeneration = 0;
      let touchStart = null;

      function setStatus(message, isError) {
        status.hidden = !message;
        status.textContent = message;
        if (isError) {
          const hint = document.createElement('span');
          hint.textContent = ' 원본 저장 버튼으로 PDF 파일을 받을 수 있습니다.';
          status.appendChild(hint);
        }
        canvas.hidden = Boolean(message) || viewMode !== 'page';
      }

      function updateControls() {
        const total = pdfDocument ? pdfDocument.numPages : 0;
        pageNumberInput.max = String(total || 1);
        pageNumberInput.value = String(currentPage);
        pageCount.textContent = total ? String(total) : '—';
        pageSummary.textContent = total ? `${total.toLocaleString('ko-KR')}페이지 · 한 장씩 보기` : '페이지별 보기';
        previousButton.disabled = !total || currentPage <= 1;
        nextButton.disabled = !total || currentPage >= total;
        progress.style.width = total ? `${(currentPage / total) * 100}%` : '0%';
        zoomLabel.textContent = zoom === 1 ? '맞춤' : `${Math.round(zoom * 100)}%`;
        viewModeToggle.textContent = viewMode === 'overview' ? '1페이지 보기' : '전체 페이지';
        document.getElementById('zoomOut').disabled = viewMode !== 'page';
        document.getElementById('zoomIn').disabled = viewMode !== 'page';
      }

      function setViewMode(mode) {
        viewMode = mode;
        overview.hidden = mode !== 'overview';
        stage.hidden = mode !== 'page';
        canvas.hidden = mode !== 'page' || !pdfDocument;
        updateControls();
        if (mode === 'page' && pdfDocument) {
          setStatus('페이지를 그리는 중입니다.', false);
          renderCurrentPage().catch(error => {
            if (error.name !== 'RenderingCancelledException') {
              console.error('PDF 페이지 렌더링 실패:', error);
              setStatus('이 페이지를 표시하지 못했습니다.', true);
            }
          });
        } else {
          setStatus('', false);
        }
      }

      function clearPageOverview() {
        overview.querySelectorAll('.page-thumb').forEach(button => {
          if (thumbnailObserver) thumbnailObserver.unobserve(button);
        });
        overview.replaceChildren();
      }

      function buildPageOverview(documentToShow, generation) {
        clearPageOverview();
        for (let page = 1; page <= documentToShow.numPages; page += 1) {
          const button = document.createElement('button');
          button.className = 'page-thumb';
          button.type = 'button';
          button.setAttribute('aria-label', `${page}페이지 크게 보기`);
          button.dataset.page = String(page);

          const preview = document.createElement('span');
          preview.className = 'page-thumb-canvas-wrap';
          preview.setAttribute('aria-hidden', 'true');
          const skeleton = document.createElement('span');
          skeleton.className = 'page-thumb-skeleton';
          preview.append(skeleton);

          const label = document.createElement('span');
          label.className = 'page-thumb-label';
          label.textContent = `${page}페이지`;
          button.append(preview, label);
          button.addEventListener('click', () => {
            currentPage = page;
            pageNumberInput.value = String(page);
            setViewMode('page');
          });
          overview.append(button);
          if (thumbnailObserver) thumbnailObserver.observe(button);
        }
        if (!('IntersectionObserver' in window)) {
          overview.querySelectorAll('.page-thumb').forEach(renderThumbnail);
        }
        if (generation !== loadGeneration) overview.replaceChildren();
      }

      async function renderThumbnail(button) {
        if (thumbnailObserver) thumbnailObserver.unobserve(button);
        const pageNumber = Number(button.dataset.page);
        const documentToRender = pdfDocument;
        const generation = loadGeneration;
        if (!documentToRender || !pageNumber) return;

        try {
          const page = await documentToRender.getPage(pageNumber);
          if (generation !== loadGeneration || documentToRender !== pdfDocument || !button.isConnected) return;
          const baseViewport = page.getViewport({ scale: 1 });
          const maxWidth = Math.max(100, button.clientWidth - 22);
          const maxHeight = window.innerWidth <= 700 ? 150 : 172;
          const scale = Math.min(maxWidth / baseViewport.width, maxHeight / baseViewport.height);
          const viewport = page.getViewport({ scale });
          const thumbnail = document.createElement('canvas');
          thumbnail.width = Math.ceil(viewport.width);
          thumbnail.height = Math.ceil(viewport.height);
          thumbnail.setAttribute('aria-hidden', 'true');
          await page.render({ canvasContext: thumbnail.getContext('2d', { alpha: false }), viewport }).promise;
          if (generation !== loadGeneration || !button.isConnected) return;
          const preview = button.querySelector('.page-thumb-canvas-wrap');
          if (preview) preview.replaceChildren(thumbnail);
        } catch (error) {
          if (error.name !== 'RenderingCancelledException') {
            console.error(`PDF ${pageNumber}페이지 미리보기 실패:`, error);
            button.classList.add('preview-error');
          }
        }
      }

      async function renderCurrentPage() {
        if (!pdfDocument) return;
        const documentToRender = pdfDocument;
        const pageNumber = currentPage;
        const generation = ++renderGeneration;
        if (renderTask) renderTask.cancel();
        renderTask = null;
        const page = await documentToRender.getPage(pageNumber);
        if (generation !== renderGeneration || documentToRender !== pdfDocument) return;
        canvas.setAttribute('aria-label', `${viewerName.textContent}, ${pageNumber}페이지`);
        const baseViewport = page.getViewport({ scale: 1 });
        const availableWidth = Math.max(240, stage.clientWidth - (window.innerWidth <= 700 ? 18 : 52));
        const scale = Math.min(2.5, (availableWidth / baseViewport.width) * zoom);
        const viewport = page.getViewport({ scale });
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(viewport.width * pixelRatio);
        canvas.height = Math.floor(viewport.height * pixelRatio);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        const task = page.render({ canvasContext: context, viewport });
        renderTask = task;
        try {
          await task.promise;
        } catch (error) {
          if (error.name !== 'RenderingCancelledException') throw error;
        }
        if (generation !== renderGeneration || documentToRender !== pdfDocument) return;
        renderTask = null;
        setStatus('', false);
        updateControls();
      }

      async function loadManual(id) {
        const manual = manuals[id];
        if (!manual) return;
        const generation = ++loadGeneration;
        renderGeneration += 1;
        if (renderTask) renderTask.cancel();
        renderTask = null;
        if (loadingTask) loadingTask.destroy();
        if (pdfDocument) {
          pdfDocument.destroy().catch(error => console.error('이전 매뉴얼 정리 실패:', error));
        }
        pdfDocument = null;
        currentPage = 1;
        zoom = 1;
        viewMode = 'overview';
        clearPageOverview();
        overview.hidden = true;
        stage.hidden = true;
        viewer.setAttribute('aria-labelledby', manual.tab);
        viewerName.textContent = manual.title;
        downloadLink.href = manual.file;
        downloadLink.setAttribute('download', `${manual.title}.pdf`);
        updateControls();
        setStatus('매뉴얼을 불러오는 중입니다.', false);

        if (!window.pdfjsLib) {
          setStatus('PDF 뷰어를 불러오지 못했습니다.', true);
          return;
        }

        try {
          loadingTask = pdfjsLib.getDocument({ url: manual.file });
          const loadedDocument = await loadingTask.promise;
          if (generation !== loadGeneration) {
            await loadedDocument.destroy();
            return;
          }
          loadingTask = null;
          pdfDocument = loadedDocument;
          overview.hidden = false;
          buildPageOverview(pdfDocument, generation);
          setViewMode('overview');
          updateControls();
        } catch (error) {
          if (generation !== loadGeneration) return;
          console.error('매뉴얼 PDF 로드 실패:', error);
          setStatus('매뉴얼을 표시할 수 없습니다. 인터넷 연결을 확인해 주세요.', true);
        }
      }

      function goToPage(page) {
        if (!pdfDocument) return;
        currentPage = Math.max(1, Math.min(pdfDocument.numPages, page));
        updateControls();
        if (viewMode !== 'page') {
          setViewMode('page');
          return;
        }
        setStatus('페이지를 그리는 중입니다.', false);
        renderCurrentPage().catch(error => {
          if (error.name !== 'RenderingCancelledException') {
            console.error('PDF 페이지 렌더링 실패:', error);
            setStatus('이 페이지를 표시하지 못했습니다.', true);
          }
        });
      }

      function selectManual(id, updateAddress) {
        const manual = manuals[id];
        if (!manual) return;

        tabs.forEach(tab => {
          const selected = tab.dataset.manual === id;
          tab.setAttribute('aria-selected', String(selected));
          tab.tabIndex = selected ? 0 : -1;
        });
        loadManual(id);

        if (updateAddress) {
          const url = new URL(window.location.href);
          url.searchParams.set('doc', id);
          window.history.replaceState(null, '', url);
        }
      }

      tabs.forEach((tab, index) => {
        tab.addEventListener('click', () => selectManual(tab.dataset.manual, true));
        tab.addEventListener('keydown', event => {
          if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
          event.preventDefault();
          const nextIndex = event.key === 'Home' ? 0
            : event.key === 'End' ? tabs.length - 1
            : (index + (event.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
          tabs[nextIndex].focus();
          selectManual(tabs[nextIndex].dataset.manual, true);
        });
      });

      const thumbnailObserver = 'IntersectionObserver' in window
        ? new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) renderThumbnail(entry.target);
          });
        }, { rootMargin: '320px 0px' })
        : null;
      viewModeToggle.addEventListener('click', () => {
        setViewMode(viewMode === 'overview' ? 'page' : 'overview');
      });
      previousButton.addEventListener('click', () => goToPage(currentPage - 1));
      nextButton.addEventListener('click', () => goToPage(currentPage + 1));
      pageNumberInput.addEventListener('change', () => goToPage(Number(pageNumberInput.value) || 1));
      document.getElementById('zoomOut').addEventListener('click', () => {
        zoom = Math.max(0.75, Math.round((zoom - 0.25) * 100) / 100);
        updateControls();
        goToPage(currentPage);
      });
      document.getElementById('zoomIn').addEventListener('click', () => {
        zoom = Math.min(2.5, Math.round((zoom + 0.25) * 100) / 100);
        updateControls();
        goToPage(currentPage);
      });
      stage.addEventListener('touchstart', event => {
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
      }, { passive: true });
      stage.addEventListener('touchend', event => {
        if (!touchStart) return;
        const touch = event.changedTouches[0];
        const deltaX = touch.clientX - touchStart.x;
        const deltaY = touch.clientY - touchStart.y;
        if (Math.abs(deltaX) > 60 && Math.abs(deltaX) > Math.abs(deltaY) * 1.3) {
          goToPage(currentPage + (deltaX < 0 ? 1 : -1));
        }
        touchStart = null;
      }, { passive: true });
      window.addEventListener('resize', () => {
        if (pdfDocument && viewMode === 'page') goToPage(currentPage);
      });

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          const { data: { session }, error } = await supabaseClient.auth.getSession();
          if (error) throw error;
          if (!session) {
            window.location.href = '/index.html';
            return;
          }

          if (!window.pdfjsLib) {
            setStatus('PDF 뷰어 파일을 불러오지 못했습니다. 연결을 확인한 뒤 다시 열어 주세요.', true);
            return;
          }
          pdfjsLib.GlobalWorkerOptions.workerSrc = workerSource;
          const initialId = new URLSearchParams(window.location.search).get('doc');
          const selectedId = initialId && manuals[initialId] ? initialId : 'action';
          selectManual(selectedId, false);
        } catch (error) {
          console.error('매뉴얼 페이지 초기화 실패:', error);
          setStatus('매뉴얼 페이지를 초기화하지 못했습니다. 다시 열어 주세요.', true);
        }
      });
    })();
  </script>
</body>
