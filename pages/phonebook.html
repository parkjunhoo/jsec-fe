<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1220">
  <title>지산리조트 보안팀 - 지산 연락망</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      color-scheme: dark;
      --page: #0b1220;
      --panel: #121d2e;
      --raised: #172438;
      --line: rgba(190, 211, 239, 0.11);
      --text: #f3f7fc;
      --muted: #92a2b8;
      --blue: #72c7ff;
      --green: #8ee3bd;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding-bottom: 36px;
      background: radial-gradient(ellipse at 85% -10%, rgba(26, 106, 157, 0.22), transparent 38rem), var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    button, input { font: inherit; }

    .directory { width: min(960px, 100%); margin: 0 auto; padding: 28px 24px 0; }
    .hero { margin-bottom: 22px; }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--blue);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }
    .eyebrow::before { width: 18px; height: 1px; background: currentColor; content: ""; }
    .hero h1 { margin: 0; font-size: clamp(25px, 4vw, 34px); letter-spacing: -0.045em; }
    .hero p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }

    .search-panel {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(18, 29, 46, 0.88);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.12);
    }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute;
      top: 50%;
      left: 15px;
      color: var(--muted);
      font-size: 17px;
      pointer-events: none;
      transform: translateY(-50%);
    }
    .search-input {
      width: 100%;
      height: 50px;
      padding: 0 44px;
      border: 1px solid rgba(190, 211, 239, 0.13);
      border-radius: 12px;
      outline: 0;
      background: #0d1726;
      color: var(--text);
      font-size: 14px;
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }
    .search-input::placeholder { color: #72839a; }
    .search-input:focus { border-color: rgba(114, 199, 255, 0.7); box-shadow: 0 0 0 3px rgba(114, 199, 255, 0.1); }
    .clear-search {
      position: absolute;
      top: 50%;
      right: 11px;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 19px;
      cursor: pointer;
      transform: translateY(-50%);
    }
    .clear-search[hidden] { display: none; }

    .filter-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 17px 1px 9px;
    }
    .filter-heading span:first-child { color: #aabbd0; font-size: 11px; font-weight: 750; letter-spacing: 0.08em; }
    .filter-heading span:last-child { color: var(--muted); font-size: 11px; }
    .department-filters {
      position: relative;
    }
    .department-filter {
      width: 100%;
      min-height: 44px;
      appearance: none;
      padding: 0 42px 0 13px;
      border: 1px solid rgba(190, 211, 239, 0.15);
      border-radius: 11px;
      outline: 0;
      background: #0d1726;
      color: var(--text);
      font-size: 14px;
      cursor: pointer;
    }
    .department-filter:focus { border-color: rgba(114, 199, 255, 0.7); box-shadow: 0 0 0 3px rgba(114, 199, 255, 0.09); }
    .department-filter option { background: #121d2e; color: var(--text); }
    .department-filter-chevron {
      position: absolute;
      top: 50%;
      right: 15px;
      color: var(--blue);
      font-size: 12px;
      pointer-events: none;
      transform: translateY(-50%);
    }
    .directory-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 19px 2px 10px;
    }
    .directory-toolbar-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; }
    .favorites-only-toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; font-weight: 650; white-space: nowrap; cursor: pointer; }
    .favorites-only-toggle input { width: 16px; height: 16px; accent-color: #eab84f; }
    .result-count { color: var(--muted); font-size: 12px; }
    .result-count strong { color: var(--text); font-size: 14px; }
    .reset-filters {
      padding: 6px 0 6px 8px;
      border: 0;
      background: transparent;
      color: var(--blue);
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
    }
    .contact-list { display: grid; gap: 16px; }
    .department-section {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(155deg, rgba(18, 29, 46, 0.9), rgba(13, 22, 36, 0.94));
    }
    .department-section-header {
      display: flex;
      min-height: 60px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 11px 15px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.018);
    }
    .department-section-title { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .department-index {
      display: grid;
      width: 32px;
      height: 32px;
      flex: 0 0 32px;
      place-items: center;
      border: 1px solid rgba(114, 199, 255, 0.16);
      border-radius: 10px;
      background: rgba(114, 199, 255, 0.08);
      color: var(--blue);
      font-size: 10px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .department-section-title h2 { margin: 0; overflow: hidden; font-size: 15px; font-weight: 750; letter-spacing: -0.02em; text-overflow: ellipsis; white-space: nowrap; }
    .department-section-count { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
    .department-contacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; padding: 0 15px; }
    .contact-card {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
      min-height: 81px;
      padding: 11px 2px;
      border-bottom: 1px solid rgba(190, 211, 239, 0.075);
    }
    .contact-card:nth-last-child(-n + 2) { border-bottom-color: transparent; }
    .person-avatar {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border: 1px solid rgba(114, 199, 255, 0.14);
      border-radius: 14px;
      background: rgba(114, 199, 255, 0.085);
      color: #9bd8ff;
      font-size: 17px;
      font-weight: 800;
    }
    .contact-info { min-width: 0; flex: 1; }
    .contact-name-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; }
    .contact-name { overflow: hidden; font-size: 15px; font-weight: 780; letter-spacing: -0.02em; text-overflow: ellipsis; white-space: nowrap; }
    .contact-position { color: #98a9bf; font-size: 10px; font-weight: 600; }
    .contact-team {
      display: block;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .contact-phone { display: block; margin-top: 5px; color: #c3d1e2; font-size: 12px; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .contact-actions { display: flex; flex: 0 0 auto; align-items: center; gap: 6px; }
    .contact-favorite { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; border: 1px solid var(--line); border-radius: 10px; background: transparent; color: var(--muted); font-size: 19px; cursor: pointer; }
    .contact-favorite[aria-pressed="true"] { border-color: rgba(234, 184, 79, 0.4); background: rgba(234, 184, 79, 0.08); color: #eab84f; }
    .contact-favorite:hover, .contact-favorite:focus-visible { border-color: rgba(234, 184, 79, 0.65); color: #eab84f; }
    .contact-favorite:focus-visible { outline: 2px solid rgba(234, 184, 79, 0.45); outline-offset: 2px; }
    .contact-edit, .contact-delete {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.035);
      color: #b9c9dc;
      font-size: 13px;
      cursor: pointer;
    }
    .contact-edit:hover { border-color: rgba(114, 199, 255, 0.38); color: var(--blue); }
    .contact-delete { color: #f09b9b; }
    .contact-delete:hover { border-color: rgba(240, 120, 120, 0.38); color: #ffb0b0; }
    .directory-state {
      grid-column: 1 / -1;
      padding: 44px 20px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: rgba(18, 29, 46, 0.74);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    .loading-indicator {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid rgba(146, 162, 184, 0.28);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .directory-state strong { display: block; margin-bottom: 5px; color: var(--text); font-size: 15px; }
    .directory-state button {
      min-height: 38px;
      margin-top: 14px;
      padding: 0 15px;
      border: 1px solid rgba(114, 199, 255, 0.35);
      border-radius: 10px;
      background: rgba(56, 144, 199, 0.14);
      color: #9bd8ff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .directory-state[hidden] { display: none; }
    .directory-toolbar { min-height: 40px; }
    .add-contact {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid rgba(114, 199, 255, 0.28);
      border-radius: 10px;
      background: rgba(56, 144, 199, 0.16);
      color: #9bd8ff;
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }
    .add-contact[hidden] { display: none; }
    .add-contact:hover { background: rgba(56, 144, 199, 0.25); }
    .modal-overlay {
      position: fixed;
      z-index: 500;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(3, 8, 15, 0.76);
      backdrop-filter: blur(7px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .contact-modal {
      width: min(100%, 480px);
      max-height: min(90vh, 720px);
      overflow-y: auto;
      padding: 21px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #121d2e;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.46);
      transform: translateY(8px);
      transition: transform 160ms ease;
    }
    .modal-overlay.active .contact-modal { transform: translateY(0); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .modal-header h2 { margin: 0; font-size: 18px; letter-spacing: -0.025em; }
    .modal-close {
      display: grid;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      color: var(--muted);
      font-size: 19px;
      cursor: pointer;
    }
    .contact-form { display: grid; gap: 13px; }
    .form-field { display: grid; gap: 6px; }
    .form-field label { color: #c1cede; font-size: 12px; font-weight: 650; }
    .form-field input {
      width: 100%;
      height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(190, 211, 239, 0.15);
      border-radius: 10px;
      outline: 0;
      background: #0b1523;
      color: var(--text);
      font-size: 14px;
    }
    .form-field input:focus { border-color: rgba(114, 199, 255, 0.7); box-shadow: 0 0 0 3px rgba(114, 199, 255, 0.09); }
    .form-field input::placeholder { color: #72839a; }
    .form-hint { margin: -4px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .form-error {
      margin: 0;
      padding: 10px 11px;
      border: 1px solid rgba(248, 113, 113, 0.25);
      border-radius: 9px;
      background: rgba(239, 68, 68, 0.09);
      color: #fca5a5;
      font-size: 12px;
      line-height: 1.5;
    }
    .form-error[hidden] { display: none; }
    .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .form-cancel, .form-submit {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .form-cancel { border: 1px solid var(--line); background: rgba(255, 255, 255, 0.035); color: #c4d0df; }
    .form-submit { border: 1px solid rgba(114, 199, 255, 0.34); background: rgba(56, 144, 199, 0.2); color: #a6ddff; }
    .form-cancel:disabled, .form-submit:disabled { opacity: 0.55; cursor: wait; }

    @media (max-width: 680px) {
      .directory { padding: 22px 14px 0; }
      .hero { margin-bottom: 17px; }
      .hero p { max-width: 27rem; font-size: 12px; }
      .search-panel { padding: 12px; border-radius: 14px; }
      .search-input { height: 48px; font-size: 16px; }
      .filter-heading { margin-top: 15px; }
      .directory-toolbar { margin-top: 15px; }
      .contact-list { gap: 12px; }
      .department-section { border-radius: 14px; }
      .department-section-header { min-height: 55px; padding: 9px 12px; }
      .department-section-title h2 { font-size: 14px; }
      .department-contacts { grid-template-columns: 1fr; padding: 0 12px; }
      .contact-card { min-height: 75px; gap: 9px; }
      .contact-card:nth-last-child(-n + 2) { border-bottom-color: rgba(190, 211, 239, 0.075); }
      .contact-card:last-child { border-bottom-color: transparent; }
      .person-avatar { width: 42px; height: 42px; flex-basis: 42px; border-radius: 13px; }
      .contact-actions { gap: 4px; }
      .contact-edit, .contact-delete { width: 32px; height: 34px; }
      .contact-modal { padding: 18px; }
    }
    @media (min-width: 681px) and (max-width: 850px) {
      .contact-list { grid-template-columns: 1fr; }
    }
  </style>
  <link rel="stylesheet" href="/css/app-theme.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="directory">
    <header class="hero">
      <div class="eyebrow">JISAN RESORT · CONTACTS</div>
      <h1>지산 연락망</h1>
      <p>이름이나 부서로 직원 연락처를 검색하세요.</p>
    </header>

    <section class="search-panel" aria-label="전화번호부 검색 및 필터">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input class="search-input" id="contactSearch" type="search" placeholder="이름, 부서, 직급, 전화번호 검색" autocomplete="off" aria-label="직원 검색">
        <button class="clear-search" id="clearSearch" type="button" aria-label="검색어 지우기" hidden>&times;</button>
      </div>
      <div class="filter-heading">
        <span>부서별 보기</span>
        <span id="departmentCount">불러오는 중</span>
      </div>
      <div class="department-filters">
        <select class="department-filter" id="departmentFilters" aria-label="부서 선택">
          <option value="">전체 부서</option>
        </select>
        <span class="department-filter-chevron" aria-hidden="true">▼</span>
      </div>
    </section>

    <div class="directory-toolbar">
      <p class="result-count" id="resultCount" aria-live="polite">직원 정보를 불러오고 있습니다.</p>
      <div class="directory-toolbar-actions">
        <label class="favorites-only-toggle" for="favoritesOnlyToggle"><input id="favoritesOnlyToggle" type="checkbox">즐겨찾기만</label>
        <button class="reset-filters" id="resetFilters" type="button" hidden>초기화</button>
        <button class="add-contact" id="addContactButton" type="button" hidden>＋ 연락처 등록</button>
      </div>
    </div>

    <section class="contact-list" id="contactList" aria-label="직원 목록" aria-live="polite">
      <div class="directory-state" id="directoryState">
        <span class="loading-indicator"></span>전화번호부를 불러오고 있습니다.
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="contactModal" aria-hidden="true">
    <section class="contact-modal" role="dialog" aria-modal="true" aria-labelledby="contactModalTitle">
      <header class="modal-header">
        <h2 id="contactModalTitle">연락처 등록</h2>
        <button class="modal-close" id="closeContactModal" type="button" aria-label="닫기">&times;</button>
      </header>
      <form class="contact-form" id="contactForm">
        <input id="contactId" type="hidden">
        <div class="form-field">
          <label for="contactName">이름 <span aria-hidden="true">*</span></label>
          <input id="contactName" name="name" type="text" maxlength="50" autocomplete="name" placeholder="예: 홍길동" required>
        </div>
        <div class="form-field">
          <label for="contactDepartment">부서 <span aria-hidden="true">*</span></label>
          <input id="contactDepartment" name="department" type="text" maxlength="50" list="departmentSuggestions" autocomplete="organization" placeholder="예: 시설팀" required>
          <datalist id="departmentSuggestions"></datalist>
        </div>
        <div class="form-field">
          <label for="contactSubDepartment">파트 / 소부서</label>
          <input id="contactSubDepartment" name="sub_department" type="text" maxlength="50" placeholder="예: 기계파트 (선택)">
        </div>
        <div class="form-field">
          <label for="contactPosition">직급</label>
          <input id="contactPosition" name="position" type="text" maxlength="50" placeholder="예: 책임 (선택)">
        </div>
        <div class="form-field">
          <label for="contactPhone">전화번호 <span aria-hidden="true">*</span></label>
          <input id="contactPhone" name="phone_number" type="tel" maxlength="20" inputmode="tel" autocomplete="tel" placeholder="예: 010-1234-5678" required>
          <p class="form-hint">입력한 형식 그대로 저장하고 표시합니다.</p>
        </div>
        <p class="form-error" id="contactFormError" role="alert" hidden></p>
        <div class="form-actions">
          <button class="form-cancel" id="cancelContactForm" type="button">취소</button>
          <button class="form-submit" id="saveContactButton" type="submit">등록</button>
        </div>
      </form>
    </section>
  </div>

  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script>window.Swal = window.Sweetalert2;</script>
  <script src="/js/app-loading.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/user-preferences.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const searchInput = document.getElementById('contactSearch');
      const clearSearchButton = document.getElementById('clearSearch');
      const departmentFilters = document.getElementById('departmentFilters');
      const favoritesOnlyToggle = document.getElementById('favoritesOnlyToggle');
      const departmentCount = document.getElementById('departmentCount');
      const contactList = document.getElementById('contactList');
      const resultCount = document.getElementById('resultCount');
      const resetButton = document.getElementById('resetFilters');
      const directoryState = document.getElementById('directoryState');
      const addContactButton = document.getElementById('addContactButton');
      const contactModal = document.getElementById('contactModal');
      const contactForm = document.getElementById('contactForm');
      const modalTitle = document.getElementById('contactModalTitle');
      const contactIdInput = document.getElementById('contactId');
      const formError = document.getElementById('contactFormError');
      const saveContactButton = document.getElementById('saveContactButton');
      const formCancelButton = document.getElementById('cancelContactForm');
      const modalCloseButton = document.getElementById('closeContactModal');
      const departmentSuggestions = document.getElementById('departmentSuggestions');
      const collator = new Intl.Collator('ko');
      let contacts = [];
      let favoriteContactIds = new Set();
      let selectedDepartment = '';
      let saving = false;
      let isAdmin = false;

      function normalize(value) {
        return String(value || '').toLocaleLowerCase('ko-KR').replace(/[\s()-]/g, '');
      }

      function showState(title, description, retry) {
        contactList.replaceChildren(directoryState);
        directoryState.replaceChildren();
        const heading = document.createElement('strong');
        heading.textContent = title;
        const detail = document.createElement('span');
        detail.textContent = description;
        directoryState.append(heading, detail);
        if (retry) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = '다시 불러오기';
          button.addEventListener('click', loadContacts);
          directoryState.append(button);
        }
        directoryState.hidden = false;
        resultCount.textContent = title;
      }

      function renderDepartmentFilters() {
        const departments = [...new Set(contacts.map(contact => contact.department))].sort(collator.compare);
        if (selectedDepartment && !departments.includes(selectedDepartment)) selectedDepartment = '';
        departmentFilters.replaceChildren();
        const allOption = document.createElement('option');
        allOption.value = '';
        allOption.textContent = `전체 부서 · ${contacts.length}명`;
        departmentFilters.append(allOption);

        departments.forEach(department => {
          const option = document.createElement('option');
          option.value = department;
          option.textContent = `${department} · ${contacts.filter(contact => contact.department === department).length}명`;
          departmentFilters.append(option);
        });
        departmentFilters.value = selectedDepartment;
        departmentSuggestions.replaceChildren();
        departments.forEach(department => {
          const option = document.createElement('option');
          option.value = department;
          departmentSuggestions.append(option);
        });
        departmentCount.textContent = `${departments.length}개 부서 · 선택해 이동`;
      }

      function makeContactCard(contact) {
        const card = document.createElement('article');
        card.className = 'contact-card';

        const avatar = document.createElement('div');
        avatar.className = 'person-avatar';
        avatar.setAttribute('aria-hidden', 'true');
        avatar.textContent = contact.name.trim().charAt(0) || '?';

        const info = document.createElement('div');
        info.className = 'contact-info';
        const nameRow = document.createElement('div');
        nameRow.className = 'contact-name-row';
        const name = document.createElement('strong');
        name.className = 'contact-name';
        name.textContent = contact.name;
        nameRow.append(name);
        if (contact.position) {
          const position = document.createElement('span');
          position.className = 'contact-position';
          position.textContent = contact.position;
          nameRow.append(position);
        }

        const team = document.createElement('span');
        team.className = 'contact-team';
        team.textContent = contact.sub_department
          ? `${contact.department} · ${contact.sub_department}`
          : contact.department;

        const phone = document.createElement('span');
        phone.className = 'contact-phone';
        phone.textContent = contact.phone_number;

        info.append(nameRow, team, phone);
        card.append(avatar, info);
        const actions = document.createElement('div');
        actions.className = 'contact-actions';
        const favoriteButton = document.createElement('button');
        const isFavorite = favoriteContactIds.has(String(contact.id));
        favoriteButton.className = 'contact-favorite';
        favoriteButton.type = 'button';
        favoriteButton.dataset.contactFavorite = String(contact.id);
        favoriteButton.setAttribute('aria-pressed', String(isFavorite));
        favoriteButton.setAttribute('aria-label', `${contact.name} ${isFavorite ? '즐겨찾기 해제' : '즐겨찾기 추가'}`);
        favoriteButton.title = isFavorite ? '즐겨찾기 해제' : '즐겨찾기 추가';
        favoriteButton.textContent = isFavorite ? '★' : '☆';
        actions.append(favoriteButton);
        if (isAdmin) {
          const editButton = document.createElement('button');
          editButton.className = 'contact-edit';
          editButton.type = 'button';
          editButton.dataset.contactAction = 'edit';
          editButton.dataset.contactId = String(contact.id);
          editButton.setAttribute('aria-label', `${contact.name} 연락처 수정`);
          editButton.textContent = '✎';
          const deleteButton = document.createElement('button');
          deleteButton.className = 'contact-delete';
          deleteButton.type = 'button';
          deleteButton.dataset.contactAction = 'delete';
          deleteButton.dataset.contactId = String(contact.id);
          deleteButton.setAttribute('aria-label', `${contact.name} 연락처 삭제`);
          deleteButton.textContent = '⌫';
          actions.append(editButton, deleteButton);
        }
        card.append(actions);
        return card;
      }

      function openContactForm(contact) {
        if (!isAdmin) return;
        contactForm.reset();
        contactIdInput.value = contact ? String(contact.id) : '';
        document.getElementById('contactName').value = contact ? contact.name : '';
        document.getElementById('contactDepartment').value = contact ? contact.department : '';
        document.getElementById('contactSubDepartment').value = contact ? contact.sub_department : '';
        document.getElementById('contactPosition').value = contact ? contact.position : '';
        document.getElementById('contactPhone').value = contact ? contact.phone_number : '';
        modalTitle.textContent = contact ? '연락처 수정' : '연락처 등록';
        saveContactButton.textContent = contact ? '변경사항 저장' : '등록';
        formError.hidden = true;
        formError.textContent = '';
        contactModal.classList.add('active');
        contactModal.setAttribute('aria-hidden', 'false');
        window.setTimeout(() => document.getElementById('contactName').focus(), 50);
      }

      function closeContactForm() {
        if (saving) return;
        contactModal.classList.remove('active');
        contactModal.setAttribute('aria-hidden', 'true');
      }

      function renderContacts() {
        const query = normalize(searchInput.value);
        const filtered = contacts.filter(contact => {
          if (favoritesOnlyToggle.checked && !favoriteContactIds.has(String(contact.id))) return false;
          if (selectedDepartment && contact.department !== selectedDepartment) return false;
          const searchable = normalize([
            contact.name,
            contact.department,
            contact.sub_department,
            contact.position,
            contact.phone_number
          ].join(' '));
          return !query || searchable.includes(query);
        });

        contactList.replaceChildren();
        resultCount.replaceChildren();
        const count = document.createElement('strong');
        count.textContent = String(filtered.length);
        resultCount.append(count, document.createTextNode(`명 표시 · 전체 ${contacts.length}명`));
        resetButton.hidden = !selectedDepartment && !searchInput.value && !favoritesOnlyToggle.checked;
        directoryState.hidden = true;

        if (filtered.length === 0) {
          showState('검색 결과가 없습니다', '검색어나 부서 필터를 바꿔 다시 확인해 주세요.', false);
          return;
        }

        const groups = new Map();
        filtered.forEach(contact => {
          if (!groups.has(contact.department)) groups.set(contact.department, []);
          groups.get(contact.department).push(contact);
        });
        [...groups.keys()].sort(collator.compare).forEach((department, index) => {
          const section = document.createElement('section');
          section.className = 'department-section';
          const header = document.createElement('header');
          header.className = 'department-section-header';
          const titleGroup = document.createElement('div');
          titleGroup.className = 'department-section-title';
          const number = document.createElement('span');
          number.className = 'department-index';
          number.setAttribute('aria-hidden', 'true');
          number.textContent = String(index + 1).padStart(2, '0');
          const heading = document.createElement('h2');
          heading.textContent = department;
          titleGroup.append(number, heading);
          const countLabel = document.createElement('span');
          countLabel.className = 'department-section-count';
          countLabel.textContent = `${groups.get(department).length}명`;
          header.append(titleGroup, countLabel);

          const list = document.createElement('div');
          list.className = 'department-contacts';
          groups.get(department)
            .sort((a, b) => collator.compare(a.name, b.name) || collator.compare(a.position || '', b.position || ''))
            .forEach(contact => list.append(makeContactCard(contact)));
          section.append(header, list);
          contactList.append(section);
        });
      }

      async function loadContacts() {
        directoryState.hidden = false;
        directoryState.textContent = '전화번호부를 불러오고 있습니다.';
        contactList.replaceChildren(directoryState);
        resultCount.textContent = '직원 정보를 불러오고 있습니다.';
        departmentCount.textContent = '불러오는 중';

        try {
          const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError) throw sessionError;
          if (!session) {
            window.location.href = '/index.html';
            return;
          }

          const { data: profile, error: profileError } = await supabaseClient
            .from('users')
            .select('role')
            .eq('id', session.user.id)
            .maybeSingle();
          if (profileError) throw profileError;
          isAdmin = profile?.role === 'admin';
          addContactButton.hidden = !isAdmin;
          await window.userPreferences?.load();
          favoriteContactIds = new Set((window.userPreferences?.getFavorites() || [])
            .filter(item => item.type === 'contact')
            .map(item => item.key));

          const { data, error } = await supabaseClient
            .from('phonebook')
            .select('id, department, sub_department, position, name, phone_number')
            .order('department')
            .order('name');
          if (error) throw error;

          contacts = (data || []).map(contact => ({
            ...contact,
            department: String(contact.department || '').trim(),
            sub_department: String(contact.sub_department || '').trim(),
            position: String(contact.position || '').trim(),
            name: String(contact.name || '').trim(),
            phone_number: String(contact.phone_number || '').trim()
          })).filter(contact => contact.department && contact.name && contact.phone_number);
          renderDepartmentFilters();
          renderContacts();
        } catch (error) {
          console.error('직원 전화번호부 조회 실패:', error);
          departmentCount.textContent = '조회 실패';
          showState('전화번호부를 불러오지 못했습니다', '연결을 확인하고 다시 시도해 주세요. 문제가 계속되면 관리자에게 문의해 주세요.', true);
        }
      }

      async function saveContact(event) {
        event.preventDefault();
        if (!isAdmin) return;
        if (saving) return;

        const name = document.getElementById('contactName').value.trim();
        const department = document.getElementById('contactDepartment').value.trim();
        const subDepartment = document.getElementById('contactSubDepartment').value.trim();
        const position = document.getElementById('contactPosition').value.trim();
        const phoneNumber = document.getElementById('contactPhone').value.trim();
        const digits = phoneNumber.replace(/\D/g, '');
        if (!name || !department || !phoneNumber) {
          formError.textContent = '이름, 부서, 전화번호를 입력해 주세요.';
          formError.hidden = false;
          return;
        }
        if (digits.length < 7 || digits.length > 15) {
          formError.textContent = '전화번호 숫자를 7~15자리로 입력해 주세요.';
          formError.hidden = false;
          return;
        }

        const id = contactIdInput.value;
        const values = {
          name,
          department,
          sub_department: subDepartment || null,
          position: position || null,
          phone_number: phoneNumber
        };
        saving = true;
        saveContactButton.disabled = true;
        formCancelButton.disabled = true;
        modalCloseButton.disabled = true;
        saveContactButton.textContent = id ? '저장 중...' : '등록 중...';
        formError.hidden = true;

        try {
          const operation = id
            ? supabaseClient.from('phonebook').update(values).eq('id', id).select('id').maybeSingle()
            : supabaseClient.from('phonebook').insert(values).select('id').single();
          const { data, error } = await operation;
          if (error) throw error;
          if (!data) throw new Error('연락처를 변경하지 못했습니다. 권한 또는 기존 데이터를 확인해 주세요.');

          saving = false;
          closeContactForm();
          await loadContacts();
        } catch (error) {
          console.error('직원 연락처 저장 실패:', error);
          formError.textContent = `저장하지 못했습니다: ${error.message || '잠시 후 다시 시도해 주세요.'}`;
          formError.hidden = false;
        } finally {
          saving = false;
          saveContactButton.disabled = false;
          formCancelButton.disabled = false;
          modalCloseButton.disabled = false;
          saveContactButton.textContent = id ? '변경사항 저장' : '등록';
        }
      }

      async function deleteContact(contact) {
        if (!isAdmin) return;
        const confirmation = await Swal.fire({
          icon: 'warning',
          title: '연락처를 삭제할까요?',
          text: `${contact.name}님의 연락처가 영구 삭제됩니다.`,
          showCancelButton: true,
          confirmButtonText: '삭제',
          cancelButtonText: '취소',
          reverseButtons: true,
          focusCancel: true
        });
        if (!confirmation.isConfirmed) return;

        try {
          const { data, error } = await supabaseClient
            .from('phonebook')
            .delete()
            .eq('id', contact.id)
            .select('id');
          if (error) throw error;
          if (!data || data.length === 0) {
            throw new Error('삭제되지 않았습니다. 권한 또는 이미 삭제된 데이터를 확인해 주세요.');
          }
          await loadContacts();
        } catch (error) {
          console.error('직원 연락처 삭제 실패:', error);
          await Swal.fire({
            icon: 'error',
            title: '삭제하지 못했습니다',
            text: error.message || '잠시 후 다시 시도해 주세요.'
          });
        }
      }

      searchInput.addEventListener('input', () => {
        clearSearchButton.hidden = !searchInput.value;
        renderContacts();
      });
      clearSearchButton.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchButton.hidden = true;
        searchInput.focus();
        renderContacts();
      });
      departmentFilters.addEventListener('change', () => {
        selectedDepartment = departmentFilters.value;
        renderContacts();
      });
      favoritesOnlyToggle.addEventListener('change', renderContacts);
      resetButton.addEventListener('click', () => {
        selectedDepartment = '';
        searchInput.value = '';
        favoritesOnlyToggle.checked = false;
        clearSearchButton.hidden = true;
        departmentFilters.value = '';
        renderDepartmentFilters();
        renderContacts();
      });
      addContactButton.addEventListener('click', () => openContactForm(null));
      contactForm.addEventListener('submit', saveContact);
      formCancelButton.addEventListener('click', closeContactForm);
      modalCloseButton.addEventListener('click', closeContactForm);
      contactModal.addEventListener('click', event => {
        if (event.target === contactModal) closeContactForm();
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && contactModal.classList.contains('active')) closeContactForm();
      });
      contactList.addEventListener('click', event => {
        const favoriteButton = event.target.closest('[data-contact-favorite]');
        if (favoriteButton) {
          const contact = contacts.find(item => String(item.id) === favoriteButton.dataset.contactFavorite);
          if (!contact || !window.userPreferences) return;
          favoriteButton.disabled = true;
          window.userPreferences.toggleFavorite('contact', String(contact.id))
            .catch(async error => {
              console.error('전화번호부 즐겨찾기 저장 오류:', error);
              await Swal.fire({
                icon: 'error',
                title: '즐겨찾기를 저장하지 못했습니다',
                text: error.message || '잠시 후 다시 시도해 주세요.'
              });
            })
            .finally(() => { favoriteButton.disabled = false; });
          return;
        }
        const button = event.target.closest('[data-contact-action]');
        if (!button || !isAdmin) return;
        const contact = contacts.find(item => String(item.id) === button.dataset.contactId);
        if (!contact) return;
        if (button.dataset.contactAction === 'edit') openContactForm(contact);
        if (button.dataset.contactAction === 'delete') deleteContact(contact);
      });

      window.addEventListener('jsec:favorites-changed', event => {
        const favorites = event.detail || window.userPreferences?.getFavorites() || [];
        favoriteContactIds = new Set(favorites.filter(item => item.type === 'contact').map(item => item.key));
        renderContacts();
      });

      await loadContacts();
    });
  </script>
</body>
</html>
