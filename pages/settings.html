<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지산리조트 보안팀 - 내 정보 수정</title>
  <link rel="stylesheet" href="/lib/sw2/sweetalert2.min.css">
  
  <!-- 공통 스타일 (Tailwind CSS 및 기본 폰트/디자인 적용) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      margin: 0;
    }
  </style>

  <!-- Supabase CDN -->
  <script src="/lib/sw2/sweetalert2.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 flex flex-col min-h-screen">

  <!-- 공통 네비게이션바 영역 -->
  <div id="navbar"></div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="flex-1 max-w-md w-full mx-auto p-6 flex flex-col justify-center">
    <div class="bg-slate-800/80 backdrop-blur-md border border-slate-700/60 rounded-2xl p-6 shadow-xl">
      
      <div class="mb-6 text-center">
        <h2 class="text-xl font-bold text-white">내 정보 수정</h2>
        <p class="text-sm text-slate-400 mt-1">비밀번호 및 연락처 정보를 변경할 수 있습니다.</p>
      </div>

      <form id="settingsForm" class="space-y-4">
        <!-- 이름 (읽기 전용) -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">이름</label>
          <input type="text" id="settingName" disabled class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 text-sm text-slate-400 cursor-not-allowed">
        </div>

        <!-- 연락처 -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">연락처</label>
          <input type="text" id="settingPhone" placeholder="010-0000-0000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500">
        </div>

        <!-- 새 비밀번호 (4~16자리 입력용) -->
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">새 비밀번호 (변경시에만 입력)</label>
          <input type="password" id="settingPassword" minlength="4" maxlength="16" placeholder="4~16자리 입력" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-sky-500">
          <p class="text-[11px] text-slate-500 mt-1">변경하지 않으려면 비워두세요. (4~16자리)</p>
        </div>

        <div class="pt-4">
          <button type="submit" id="saveBtn" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg shadow-sky-600/20 text-sm">
            저장하기
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- 스크립트 연결 -->
  <script src="/js/navbar.js"></script>
  <script src="/js/settings.js"></script> <!-- 분리한 JS 파일 -->
</body>
</html>
